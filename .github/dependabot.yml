version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # The root Dockerfile and docker-compose.yml pin base images (python, postgres,
  # minio), and deploy/mock-oidc pins its JRE + Maven builder bases by digest. The
  # docker ecosystem keeps those FROM/image pins current on the same weekly, grouped,
  # 7-day-cooldown cadence as the product code (dependabot does not recurse, so the
  # subdirectory is listed explicitly).
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/deploy/mock-oidc"
      - "/deploy/seaweedfs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns:
          - "*"
