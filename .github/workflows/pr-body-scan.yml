# Scan pull-request and issue-comment body text for credentials before a human reads it.
#
# This closes the channel that published five live keys in PR #2037. Nothing else in the
# repository covers it: the detect-secrets pre-commit hook scans files, push protection guards
# pushes, and a body is neither. GitHub secret scanning did fire on that body, but it caught two
# of the five keys and it reports after the fact, as an alert, not as a failing check.
#
# The scan is a backstop, not the fix. It runs after the text reaches GitHub, so it shortens
# exposure and never prevents it. Prevention is the `gh pr create --body-file` rule in AGENTS.md:
# a body passed as a shell string runs its own backtick spans as commands, which is what dumped
# `env` into #2037.
#
# Untrusted body text reaches the checker through `env:`, never through `${{ }}` inside `run:`.
# Interpolating it into the script would reproduce the exact bug this workflow exists to catch —
# shell-evaluated body text — with the runner's token in scope.
#
# The checkout is the default one for each event: the merge ref on a pull request, the default
# branch on an issue comment. A pull request is therefore judged by its own copy of the checker.
# That is the same trade-off records.yml documents — a pull request may edit the checker, and
# nothing here detects that edit. Pinning the default branch instead would leave the checker
# unreachable on the pull request that first adds it, and would stop any later fix to the checker
# from running before merge. This repository has one maintainer, so the edit risk is small and the
# bootstrap cost is certain.
#
# No third-party action runs here beyond checkout. This job guards credentials, so its own
# supply-chain surface stays as small as it can be; gitleaks installs from a pinned release
# archive verified by sha256, and the checker itself is invoked directly rather than through
# `just` to avoid a setup action. `just check-pr-body` runs the same script with the same
# arguments, so the two paths cannot drift.

name: pr-body-scan

on:
  # `edited` is the type that carries a body rewrite, and `opened` carries the first body.
  # `synchronize` and `ready_for_review` earn their place differently: this job is a required
  # status check, and a required check must report on every head SHA a pull request presents.
  # Without `synchronize` a pushed commit would leave its new SHA with no report at all, and the
  # pull request would wait on a check that never arrives.
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]

concurrency:
  group: pr-body-scan-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions: {}

env:
  GITLEAKS_VERSION: "8.30.1"
  # A release-archive checksum, not a credential.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # pragma: allowlist secret

jobs:
  scan:
    # This name is the status-check context that branch protection requires by string, so it
    # names the job rather than describing it. Renaming it silently breaks the rule.
    name: pr-body-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      # The body arrives as data in the environment. `printf '%s'` writes it verbatim: no
      # word splitting, no glob expansion, and no command substitution.
      - name: Write the body text to a file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          printf '%s\n%s\n' "${PR_BODY}" "${COMMENT_BODY}" > "${RUNNER_TEMP}/body.md"

      - name: Scan for credentials and pasted environments
        env:
          KDIVE_GITLEAKS: ${{ runner.temp }}/gitleaks
        run: ./scripts/check-pr-body.sh "${RUNNER_TEMP}/body.md"
