name: publish-seaweedfs

on:
  pull_request:
    paths: [.github/workflows/publish-seaweedfs.yml, deploy/seaweedfs/**, docker-compose.seaweedfs.yml, scripts/verify-seaweedfs-image.py]
  push:
    branches: [main]
    paths: [.github/workflows/publish-seaweedfs.yml, deploy/seaweedfs/**, docker-compose.seaweedfs.yml, scripts/verify-seaweedfs-image.py]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-seaweedfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    name: prove ${{ matrix.platform }}
    runs-on: ubuntu-latest
    # First-run source compilation and QEMU runtime proof are the bound; revise after CI observes it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/ppc64le]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Install libvirt build headers
        # `uv run` materializes KDIVE's locked runtime dependencies, including the
        # source-only libvirt-python package.
        run: ./scripts/apt-install.sh libvirt-dev
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: docker buildx build --platform "${{ matrix.platform }}" --load -t kdive-seaweedfs:proof deploy/seaweedfs
      - run: uv run --locked python scripts/verify-seaweedfs-image.py --image kdive-seaweedfs:proof --platform "${{ matrix.platform }}"
  publish:
    if: github.event_name == 'push'
    needs: prove
    runs-on: ubuntu-latest
    # The publish repeats three builds and pushes their layers; revise after CI observes it.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/seaweedfs
          push: true
          platforms: linux/amd64,linux/arm64,linux/ppc64le
          tags: ghcr.io/randomparity/kdive-seaweedfs:4.46-${{ github.sha }}
          provenance: false
          sbom: false
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          platforms="$(docker buildx imagetools inspect "ghcr.io/randomparity/kdive-seaweedfs@${DIGEST}" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
          for want in linux/amd64 linux/arm64 linux/ppc64le; do case " ${platforms} " in *" ${want} "*) ;; *) exit 1;; esac; done
