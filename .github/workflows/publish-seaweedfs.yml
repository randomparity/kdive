name: publish-seaweedfs

on:
  pull_request:
    paths: [deploy/seaweedfs/**, docker-compose.seaweedfs.yml, scripts/verify-seaweedfs-image.py]
  push:
    branches: [main]
    paths: [deploy/seaweedfs/**, docker-compose.seaweedfs.yml, scripts/verify-seaweedfs-image.py]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-seaweedfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    name: prove ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/ppc64le]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - run: docker buildx build --platform "${{ matrix.platform }}" --load -t kdive-seaweedfs:proof deploy/seaweedfs
      - run: uv run --locked python scripts/verify-seaweedfs-image.py --image kdive-seaweedfs:proof --platform "${{ matrix.platform }}"
  publish:
    if: github.event_name == 'push'
    needs: prove
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/seaweedfs
          push: true
          platforms: linux/amd64,linux/arm64,linux/ppc64le
          tags: ghcr.io/randomparity/kdive-seaweedfs:4.46-${{ github.sha }}
          provenance: false
          sbom: false
      - env: {DIGEST: ${{ steps.build.outputs.digest }}}
        run: |
          set -euo pipefail
          platforms="$(docker buildx imagetools inspect "ghcr.io/randomparity/kdive-seaweedfs@${DIGEST}" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
          for want in linux/amd64 linux/arm64 linux/ppc64le; do case " ${platforms} " in *" ${want} "*) ;; *) exit 1;; esac; done
