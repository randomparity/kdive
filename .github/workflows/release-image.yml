name: release-image

# Build, push, sign, then tag the kdive container image on a SemVer tag: the build pushes
# by digest only, cosign signs that immutable digest keyless/OIDC (ADR-0088 decision 8),
# and only then are the human-facing tags applied to that signed digest (ADR-0573) — no
# digest is reachable under a release tag before it is signed (#1991). The PR
# build-without-push lives in ci.yml; this is the release path. A main push builds
# linux/amd64 only so :edge stays cheap (ADR-0572); a v* tag adds the emulated
# linux/ppc64le leg for a multi-arch release manifest (ADR-0359).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

# Least privilege: read the source, write the GHCR package, and mint the OIDC token
# cosign keyless signing needs. No other scopes.
permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build · push · sbom · sign
    runs-on: ubuntu-latest
    # This job has two shapes (ADR-0572) and one bound, so the binding case sets it.
    #
    # A main push now builds linux/amd64 only, natively: nothing compiles from source, so the
    # expected runtime collapses to the native build plus layer push. Provisional bound ≲30 min
    # pending observation: the same Dockerfile's amd64 build is observed at ~2.5 min in ci.yml's
    # PR job, which does not push layers. No apt step (ADR-0566).
    #
    # A v* tag build keeps the emulated ppc64le leg and per-platform SBOM/provenance, and it is
    # the binding case for this value: observed 132 min (v0.3.0) and 241 min (v0.4.0), n=2,
    # itself provisional against a future release doing more work. Sized 300 = max observed
    # plus ~25% headroom, clear of the 360-minute default it replaces; both figures follow the
    # #1983 convention of an observed figure with its basis, re-sized when observation improves.
    # A fired timeout here costs a red check and an uncached multi-hour rebuild — nothing
    # worse: the build step pushes by digest only (ADR-0573), so a cut-off at any point
    # before `Apply tags to the signed digest` leaves at most an untagged digest no release
    # tag references. Before #1991 restructured the ordering the same cut-off stranded a
    # fully tagged, unsigned release digest (:latest included) that nothing cleaned up and
    # no re-run superseded (`cancel-in-progress: false`); the bound below now only decides
    # how much work a cut-off wastes.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches pyproject version
        # A v* tag build bakes RELEASE=true (X.Y.Z+g<sha>), so the tag must equal the packaged
        # version or the image self-reports a version that disagrees with its :X.Y.Z tag. Mirror
        # the guard release.yml enforces for the wheel (this job has no runtime --version gate) and
        # the git-derived stamp-buildinfo.sh path — so an operator's forgotten pyproject bump fails
        # here instead of publishing a signed, mislabeled release image (ADR-0370).
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          expected="v$version"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != pyproject $expected" >&2
            exit 1
          fi

      - name: Set up QEMU
        # Registers binfmt_misc handlers so buildx can build the linux/ppc64le layer under
        # emulation on this amd64 runner (ADR-0359). No POWER runner is required. Tag-only:
        # a main push builds amd64 only and never needs the handlers (ADR-0572).
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/randomparity/kdive
          # On main: a moving :edge plus an immutable :sha-<short>. On a v* tag:
          # :X.Y.Z, :X.Y, and :latest. NOTE: :latest is applied on EVERY release tag
          # (metadata-action does not compare against other tags), so it tracks the most
          # recently pushed release. This assumes forward-only releases; if you ever push a
          # backport tag, drop `latest` for that release so it doesn't move backward.
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Resolve build provenance
        # The short SHA baked into the image (ADR-0370). --short=12 pins the width so it matches
        # the wheel built by release.yml for the same tag; this shallow checkout still has HEAD.
        # Fail loudly on an empty SHA: this job has no runtime --version assertion (the pushed
        # manifest is never loaded/run), so a silent empty SHA would skip the Dockerfile
        # stamp and publish a release image mislabeled X.Y.Z-dev with no gate to catch it.
        id: prov
        run: |
          sha="$(git rev-parse --short=12 HEAD)"
          [ -n "$sha" ] || { echo "::error::empty provenance SHA from git rev-parse" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Push by digest only (ADR-0573): the `outputs:` form is buildx's documented
      # push-by-digest export — a bare `push: true` with no tag errors out ("tag is needed
      # when pushing to registry"), and this form publishes an untagged manifest at an
      # immutable @sha256 digest and reports it in `steps.build.outputs.digest`. The
      # human-facing tags are applied by a later step, after cosign signs this digest — so a
      # run cut off before then strands nothing reachable (#1991). Labels are baked into the
      # image config here; they are metadata, not reachability.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          outputs: type=image,name=ghcr.io/randomparity/kdive,push-by-digest=true,name-canonical=true,push=true
          # Bake honest version provenance into the running image (ADR-0370): a v* tag is a
          # release (X.Y.Z+g<sha>), a main push is not (X.Y.Z-dev+g<sha>).
          build-args: |
            KDIVE_COMMIT=${{ steps.prov.outputs.sha }}
            KDIVE_RELEASE=${{ startsWith(github.ref, 'refs/tags/v') }}
          # Publish a multi-arch manifest on a release tag (ADR-0359): ppc64le builds under
          # QEMU emulation, which compiles the sdist-only deps (grpcio, drgn, libvirt-python)
          # from source and is the slow leg of the job. A main push builds amd64 only so :edge
          # stays cheap (ADR-0572); between releases a POWER host pins the newest :X.Y.Z.
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/ppc64le' || 'linux/amd64' }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM + max provenance are release artifacts; a per-commit (:edge) SBOM is
          # cost with little value. Emit them only on a v* tag.
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') && 'mode=max' || 'false' }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the pushed digest
        # Sign the immutable @sha256 digest, not the mutable tag (:edge floats; a tag can
        # be retargeted after signing, the digest cannot). Runs on every push — main and
        # tags — and, because it precedes tag application (ADR-0573), a digest becomes
        # reachable under any human-facing tag only once its signature exists. Fail fast if
        # the build emitted no digest rather than signing an empty subject.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::build step produced no image digest — refusing to sign" >&2
            exit 1
          fi
          cosign sign --yes "ghcr.io/randomparity/kdive@${DIGEST}"

      - name: Apply tags to the signed digest
        # The last leg of the push → sign → tag ordering (ADR-0573): only now do the
        # metadata-action tags (:edge/:sha-<short> on main; :X.Y.Z/:X.Y/:latest on a v* tag)
        # point at the digest — which the previous step already signed. `imagetools create`
        # with a single source is a carbon copy of an index/manifest-list and, with
        # --prefer-index=false, preserves the single-platform manifest format on main pushes,
        # so each tag lands on exactly the signed digest: no rebuild, no new manifest, and
        # the referrer-attached SBOM/provenance stay bound to it.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::build step produced no image digest — refusing to tag" >&2
            exit 1
          fi
          args=()
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            args+=(-t "${tag}")
          done <<< "${TAGS}"
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "::error::metadata step produced no tags — refusing to leave the release untagged" >&2
            exit 1
          fi
          docker buildx imagetools create --prefer-index=false "${args[@]}" \
            "ghcr.io/randomparity/kdive@${DIGEST}"
