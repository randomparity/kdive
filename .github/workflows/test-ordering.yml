name: Test ordering

# Weekly checks for both hash-order-dependent collection and assertions. The PR gate
# (ci.yml) pins PYTHONHASHSEED=0 so pytest-xdist workers collect parametrized tests in the
# same order; that pin masks tests whose collection or assertions depend on set/dict
# iteration order.
#
# `just test-collect-order` replaces the old accidental per-worker xdist detector directly:
# it collects the gated marker tier under two fixed valid seeds and diffs the ordered node
# IDs, so an unsorted parametrization fails with a deterministic, locally reproducible diff.
#
# The assertion suite uses the run's number: a per-workflow counter that changes every run
# and stays in CPython's PYTHONHASHSEED range [0, 4294967295] (github.run_id already exceeds
# that range, and an out-of-range seed fatals every interpreter at startup). The seed is
# recorded in the step log and summary before the suite runs, so a red run names the
# concrete seed: `PYTHONHASHSEED=<seed> just test` locally reproduces its collection and
# assertion order (ADR-0577, #2065, #2072).

on:
  schedule:
    # Mondays 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-ordering-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-run-seed:
    name: test (PYTHONHASHSEED=<run-number>)
    runs-on: ubuntu-latest
    # The GitHub default is 360 minutes, and a wedged apt step burns all of it (#1978).
    # Observed ~7 min plus the apt script's ~11 min worst case, plus margin (ADR-0566).
    timeout-minutes: 25
    env:
      # A concrete per-run seed (the run's number) rather than CPython's unrecoverable draw:
      # a red run is reproducible with `PYTHONHASHSEED=<seed> just test` (ADR-0577, #2065).
      # The run's number, not its id: run ids already exceed CPython's seed range [0, 4294967295].
      PYTHONHASHSEED: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record the hash seed
        # The run's number is the seed (job env above). Record it before the suite runs so a
        # red run names the concrete seed to reproduce locally.
        run: |
          echo "PYTHONHASHSEED=${PYTHONHASHSEED}"
          echo "PYTHONHASHSEED=${PYTHONHASHSEED}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install libvirt build headers
        # libvirt-python has no wheels; it compiles against the system libvirt
        # headers, so `uv sync` fails without libvirt-dev present.
        # Same bounded script `just apt-install libvirt-dev` runs; `just` is not set up until
        # later in this job, so it invokes the script directly (ADR-0566, #1978).
        run: ./scripts/apt-install.sh libvirt-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.18"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Helm
        # Mirror the PR gate so the tests/helm render suite actually runs (it skips when
        # helm is absent), keeping the ordering check over the same test set as ci.yml.
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.0

      - name: Pre-pull the testcontainer images
        # Same reason as the PR gate: this job runs the same `just test` with
        # KDIVE_REQUIRE_DOCKER=1, so it carries the identical registry-cascade exposure
        # (ADR-0553, #1913). Fixing only ci.yml would leave the weekly run failing in the
        # thousands-of-errors shape that issue is about.
        run: just pull-test-images

      - name: Collection order is hash-seed-independent
        # Fixed seeds make both the verdict and any ordered node-id diff reproducible.
        run: just test-collect-order

      - name: Test (per-run hash seed)
        # KDIVE_REQUIRE_DOCKER=1 turns the db suite's skip-when-no-Docker into a hard
        # failure (ADR-0015), matching the PR gate so the schema tests are part of the
        # ordering surface. PYTHONHASHSEED is inherited from the job env.
        env:
          KDIVE_REQUIRE_DOCKER: "1"
        run: just test
