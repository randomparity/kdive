apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kdive.fullname" . }}-migrate
  labels:
    {{- include "kdive.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.bundledBackends }}
    # Demo path: the bundled Postgres subchart is created with the release's normal
    # resources, after pre-install hooks. Run migrate post-install so the DB exists.
    "helm.sh/hook": post-install,post-upgrade
    {{- else }}
    # Production path: external backends pre-exist, so migrate before app rollout.
    "helm.sh/hook": pre-install,pre-upgrade
    {{- end }}
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "kdive.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      {{- if .Values.bundledBackends }}
      initContainers:
        # The post-install hook fires when the bundled Postgres is created, not
        # ready, so wait for its port before migrating instead of burning the
        # Job's backoffLimit on connection-refused (ADR-0088 decision 7).
        - name: wait-for-db
          image: {{ include "kdive.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import socket, time, sys
              host = "{{ include "kdive.fullname" . }}-postgres"
              for _ in range(60):
                  try:
                      socket.create_connection((host, 5432), timeout=2).close()
                      sys.exit(0)
                  except OSError:
                      time.sleep(2)
              sys.exit("timed out waiting for %s:5432" % host)
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "kdive.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.bundledBackends }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              python -m kdive migrate
              python - <<'PY'
              import os
              import psycopg
              from psycopg import sql

              roles = {
                  "kdive-server-member": ("DEMO_DB_SERVER_PASSWORD", "kdive_server"),
                  "kdive-worker-member": ("DEMO_DB_WORKER_PASSWORD", "kdive_worker"),
                  "kdive-reconciler-member": (
                      "DEMO_DB_RECONCILER_PASSWORD",
                      "kdive_reconciler",
                  ),
                  "kdive-witness-member": (
                      "DEMO_DB_LIFECYCLE_WITNESS_PASSWORD",
                      "kdive_lifecycle_witness",
                  ),
              }
              with psycopg.connect(os.environ["KDIVE_DATABASE_URL"], autocommit=True) as conn:
                  for login, (password_env, capability) in roles.items():
                      conn.execute(
                          sql.SQL(
                              "DO $$ BEGIN CREATE ROLE {} LOGIN INHERIT NOSUPERUSER "
                              "NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS; "
                              "EXCEPTION WHEN duplicate_object THEN NULL; END $$"
                          ).format(sql.Identifier(login))
                      )
                      conn.execute(
                          sql.SQL("ALTER ROLE {} PASSWORD {}").format(
                              sql.Identifier(login), sql.Literal(os.environ[password_env])
                          )
                      )
                      conn.execute(
                          sql.SQL("GRANT {} TO {}").format(
                              sql.Identifier(capability), sql.Identifier(login)
                          )
                      )
              PY
          {{- else }}
          args: ["migrate"]
          {{- end }}
          env:
            {{- include "kdive.databaseEnv" .Values.databaseCredentials.migration | nindent 12 }}
            {{- if .Values.bundledBackends }}
            - name: DEMO_DB_SERVER_PASSWORD
              value: {{ .Values.demoCredentials.postgresql.serverPassword | quote }}
            - name: DEMO_DB_WORKER_PASSWORD
              value: {{ .Values.demoCredentials.postgresql.workerPassword | quote }}
            - name: DEMO_DB_RECONCILER_PASSWORD
              value: {{ .Values.demoCredentials.postgresql.reconcilerPassword | quote }}
            - name: DEMO_DB_LIFECYCLE_WITNESS_PASSWORD
              value: {{ .Values.demoCredentials.postgresql.lifecycleWitnessPassword | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "kdive.fullname" . }}-config
