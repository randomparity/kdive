apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kdive.fullname" . }}-reconciler
  labels:
    {{- include "kdive.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.reconciler.replicas }}
  selector:
    matchLabels:
      app: {{ include "kdive.fullname" . }}-reconciler
  template:
    metadata:
      labels:
        app: {{ include "kdive.fullname" . }}-reconciler
        {{- include "kdive.labels" . | nindent 8 }}
      annotations:
        {{- include "kdive.configChecksum" . | nindent 8 }}
        {{- include "kdive.scrapeAnnotations" 9466 | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kdive.fullname" . }}-worker-termination-witness
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        # fsGroup so the non-root UID can read a mounted file-ref Secret via its group bit.
        fsGroup: 10001
      {{- include "kdive.minioVersioningBarrier" . | nindent 6 }}
      containers:
        - name: reconciler
          image: {{ include "kdive.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["reconciler"]
          env:
            - name: KDIVE_LIFECYCLE_WITNESS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.workerCredentialBroker.lifecycleWitnessDatabase.secretName | quote }}
                  key: {{ .Values.workerCredentialBroker.lifecycleWitnessDatabase.key | quote }}
            - name: KDIVE_KUBERNETES_WITNESS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KDIVE_KUBERNETES_WITNESS_WORKER_NAME
              value: {{ include "kdive.fullname" . }}-worker
            - name: KDIVE_KUBERNETES_WITNESS_ORDINAL_CEILING
              value: {{ include "kdive.effectiveDeathCeiling" . | quote }}
            - name: KDIVE_KUBERNETES_CREDENTIAL_BROKER_HOST
              value: "0.0.0.0"
            - name: KDIVE_KUBERNETES_CREDENTIAL_BROKER_PORT
              value: {{ .Values.workerCredentialBroker.port | quote }}
            - name: KDIVE_KUBERNETES_CREDENTIAL_BROKER_TLS_CERT
              value: /run/kdive/worker-credential-broker-tls/{{ .Values.workerCredentialBroker.tls.certificateKey }}
            - name: KDIVE_KUBERNETES_CREDENTIAL_BROKER_TLS_KEY
              value: /run/kdive/worker-credential-broker-tls/{{ .Values.workerCredentialBroker.tls.privateKey }}
            - name: KDIVE_KUBERNETES_CREDENTIAL_BROKER_CA
              value: /run/kdive/worker-credential-broker-tls/{{ .Values.workerCredentialBroker.tls.caKey }}
            - name: KDIVE_KUBERNETES_CREDENTIAL_ENVELOPE_KEY
              value: /run/kdive/worker-credential-broker-envelope/{{ .Values.workerCredentialBroker.envelopeKey.key }}
            {{- include "kdive.auxEnv" 9466 | nindent 12 }}
            {{- include "kdive.secretsEnv" . | nindent 12 }}
            {{- include "kdive.systemsEnv" . | nindent 12 }}
            {{- include "kdive.fixturesEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "kdive.fullname" . }}-config
          # No Service fronts the reconciler; its aux listener (ADR-0090 §5) is reached
          # only by the pod-local kubelet/scrape. /readyz gates rollout progression (it
          # withdraws nothing), /livez tracks the reconcile loop — a not-ready reconciler
          # is not killed by liveness.
          ports:
            - containerPort: 9466
            - name: worker-credential-broker
              containerPort: {{ .Values.workerCredentialBroker.port }}
          {{- include "kdive.auxProbes" 9466 | nindent 10 }}
          volumeMounts:
            - name: broker-tls
              mountPath: /run/kdive/worker-credential-broker-tls
              readOnly: true
            - name: broker-envelope
              mountPath: /run/kdive/worker-credential-broker-envelope
              readOnly: true
          {{- if or .Values.secrets.secretName .Values.systems.configMapName .Values.fixtures.configMapName }}
            {{- include "kdive.secretsVolumeMount" . | nindent 12 }}
            {{- include "kdive.systemsVolumeMount" . | nindent 12 }}
            {{- include "kdive.fixturesVolumeMount" . | nindent 12 }}
          {{- end }}
      volumes:
        - name: broker-tls
          secret:
            secretName: {{ .Values.workerCredentialBroker.tls.secretName | quote }}
        - name: broker-envelope
          secret:
            secretName: {{ .Values.workerCredentialBroker.envelopeKey.secretName | quote }}
            items:
              - key: {{ .Values.workerCredentialBroker.envelopeKey.key | quote }}
                path: {{ .Values.workerCredentialBroker.envelopeKey.key | quote }}
      {{- if or .Values.secrets.secretName .Values.systems.configMapName .Values.fixtures.configMapName }}
        {{- include "kdive.secretsVolume" . | nindent 8 }}
        {{- include "kdive.systemsVolume" . | nindent 8 }}
        {{- include "kdive.fixturesVolume" . | nindent 8 }}
      {{- end }}
