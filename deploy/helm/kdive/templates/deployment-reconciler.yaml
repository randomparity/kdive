apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kdive.fullname" . }}-reconciler
  labels:
    {{- include "kdive.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.reconciler.replicas }}
  selector:
    matchLabels:
      app: {{ include "kdive.fullname" . }}-reconciler
  template:
    metadata:
      labels:
        app: {{ include "kdive.fullname" . }}-reconciler
        {{- include "kdive.labels" . | nindent 8 }}
      annotations:
        {{- include "kdive.processConfigChecksum" (dict "root" . "process" "reconciler") | nindent 8 }}
        {{- include "kdive.scrapeAnnotations" 9466 | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kdive.fullname" . }}-reconciler
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      {{- include "kdive.minioVersioningBarrier" . | nindent 6 }}
      containers:
        - name: reconciler
          image: {{ include "kdive.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["reconciler"]
          env:
            {{- include "kdive.databaseEnv" .Values.databaseCredentials.reconciler | nindent 12 }}
            {{- include "kdive.auxEnv" 9466 | nindent 12 }}
            {{- include "kdive.secretsEnv" . | nindent 12 }}
            {{- include "kdive.systemsEnv" . | nindent 12 }}
            {{- include "kdive.fixturesEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "kdive.fullname" . }}-config
          ports:
            - containerPort: 9466
          {{- include "kdive.auxProbes" 9466 | nindent 10 }}
          {{- if or .Values.secrets.secretName .Values.systems.configMapName .Values.fixtures.configMapName }}
          volumeMounts:
            {{- include "kdive.secretsVolumeMount" . | nindent 12 }}
            {{- include "kdive.systemsVolumeMount" . | nindent 12 }}
            {{- include "kdive.fixturesVolumeMount" . | nindent 12 }}
          {{- end }}
      {{- if or .Values.secrets.secretName .Values.systems.configMapName .Values.fixtures.configMapName }}
      volumes:
        {{- include "kdive.secretsVolume" . | nindent 8 }}
        {{- include "kdive.systemsVolume" . | nindent 8 }}
        {{- include "kdive.fixturesVolume" . | nindent 8 }}
      {{- end }}
