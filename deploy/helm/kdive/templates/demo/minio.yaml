{{- if .Values.bundledBackends }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kdive.fullname" . }}-seaweedfs
  labels:
    {{- include "kdive.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "kdive.fullname" . }}-seaweedfs
  template:
    metadata:
      labels:
        app: {{ include "kdive.fullname" . }}-seaweedfs
        {{- include "kdive.labels" . | nindent 8 }}
    spec:
      containers:
        - name: seaweedfs
          image: {{ .Values.demo.seaweedfs.image }}
          args: ["mini", "-dir=/data"]
          env:
            - name: S3_ACCESS_KEY
              value: {{ .Values.demoCredentials.seaweedfs.accessKey | quote }}
            - name: S3_SECRET_KEY
              value: {{ .Values.demoCredentials.seaweedfs.secretKey | quote }}
          ports:
            - containerPort: 8333
          readinessProbe:
            httpGet:
              path: /
              port: 8333
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kdive.fullname" . }}-seaweedfs
  labels:
    {{- include "kdive.labels" . | nindent 4 }}
spec:
  # Default ClusterIP keeps the bundled object store in-cluster. To drive remote-libvirt or
  # accept external build uploads the guest/uploader must reach S3 too — set
  # demo.seaweedfs.service.type=NodePort (and a node-routable KDIVE_S3_ENDPOINT_URL) to expose it.
  # The cluster network/firewall must permit the chosen NodePort.
  type: {{ .Values.demo.seaweedfs.service.type | default "ClusterIP" }}
  selector:
    app: {{ include "kdive.fullname" . }}-seaweedfs
  ports:
    - port: 8333
      targetPort: 8333
      {{- if and (eq (.Values.demo.seaweedfs.service.type | default "ClusterIP") "NodePort") .Values.demo.seaweedfs.service.nodePort }}
      nodePort: {{ .Values.demo.seaweedfs.service.nodePort }}
      {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kdive.fullname" . }}-seaweedfs-init
  labels:
    {{- include "kdive.labels" . | nindent 4 }}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "kdive.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: initialize-bucket
          image: {{ include "kdive.image" . }}
          command:
            - python
            - -m
            - kdive.store.initialize_bucket
          env:
            - name: KDIVE_S3_BUCKET
              value: {{ .Values.config.KDIVE_S3_BUCKET | quote }}
            - name: KDIVE_S3_ENDPOINT_URL
              value: {{ include "kdive.s3Endpoint" . | quote }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.demoCredentials.seaweedfs.accessKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.demoCredentials.seaweedfs.secretKey | quote }}
{{- end }}
