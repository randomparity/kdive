apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kdive.fullname" . }}-worker-credential-broker
  labels:
    {{- include "kdive.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "kdive.fullname" . }}-witness
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ include "kdive.fullname" . }}-worker
      ports:
        - protocol: TCP
          port: {{ .Values.workerCredentialBroker.port }}
