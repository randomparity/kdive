---
- name: Restart the dormant authority session libvirtd after deployed changes
  ansible.builtin.systemd_service:
    name: kdive-libvirtd-external-boot-authority.service
    scope: user
    daemon_reload: true
    state: restarted
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ live_vm_host_authority_uid }}"
  become: true
  become_user: "{{ live_vm_host_authority_account }}"

- name: Restart the external-boot authority service after deployed changes
  ansible.builtin.systemd_service:
    name: kdive-external-boot-authority.service
    daemon_reload: true
    state: restarted
