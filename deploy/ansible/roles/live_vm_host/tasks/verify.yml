---
# Resolve the service-account uid up front; ansible_facts.getent_passwd is populated only
# after this task runs (gather_facts does NOT populate it), and the /run/user path needs it.
- name: Look up the service account's passwd entry
  ansible.builtin.getent:
    database: passwd
    key: "{{ github_runner_user }}"

- name: Record the service-account uid
  ansible.builtin.set_fact:
    live_vm_host_uid: "{{ ansible_facts.getent_passwd[github_runner_user][1] }}"

# Part 1: check-local-libvirt.sh (KVM / daemons / venv-import / network / install-staging
# writability / /boot readability), run AS the service account after a connection reset so the
# just-added kvm/libvirt group membership is live, with KDIVE_PYTHON pointing at the venv.
- name: Reset the connection so new group membership is read
  ansible.builtin.meta: reset_connection

- name: Run check-local-libvirt.sh as the service account
  ansible.builtin.command: ./scripts/operations/check-local-libvirt.sh
  args:
    chdir: "{{ live_vm_venv }}"
  environment:
    KDIVE_PYTHON: "{{ live_vm_venv }}/.venv/bin/python"
    KDIVE_INSTALL_STAGING: "{{ install_staging_dir }}"
  become: true
  become_user: "{{ github_runner_user }}"
  changed_when: false

- name: Verify the unreadable-proc carrier dependency
  ansible.builtin.command: bwrap --version
  become: true
  become_user: "{{ github_runner_user }}"
  changed_when: false

# Part 2: the delta check-local-libvirt.sh does not cover. On the Ubuntu target there is no
# static disk label to assert (AppArmor/virt-aa-helper permits each domain's disk paths
# dynamically), so the gate verifies group membership and the short XDG_RUNTIME_DIR directly.
- name: Assert the service account is in kvm and libvirt
  ansible.builtin.command: "id -nG {{ github_runner_user }}"
  register: live_vm_host_groups
  changed_when: false
  failed_when: >-
    'kvm' not in live_vm_host_groups.stdout.split()
    or 'libvirt' not in live_vm_host_groups.stdout.split()

- name: Assert /run/user/<uid> exists for the service account
  ansible.builtin.stat:
    path: "/run/user/{{ live_vm_host_uid }}"
  register: live_vm_host_xdg
  failed_when: not live_vm_host_xdg.stat.exists

# Part 3: the fixed live-worker authority contract (ADR-0555). These proofs cover the identity,
# file, unit, session-libvirt daemon/provider, socket, and slot-isolation surface.
- name: Inspect the protected runtime parent
  ansible.builtin.stat:
    path: /run/kdive
  register: live_vm_host_worker_runtime_parent

- name: Inspect the protected socket namespaces
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /run/kdive/live-libvirt
    - /run/kdive/live-libvirt/libvirt
  register: live_vm_host_worker_socket_namespaces

- name: Assert the runtime parent and socket namespace authority
  ansible.builtin.assert:
    that:
      - live_vm_host_worker_runtime_parent.stat.isdir
      - live_vm_host_worker_runtime_parent.stat.pw_name == "root"
      - live_vm_host_worker_runtime_parent.stat.gr_name == "root"
      - live_vm_host_worker_runtime_parent.stat.mode == "0755"
      - item.stat.isdir
      - item.stat.pw_name == github_runner_user
      - item.stat.gr_name == live_vm_host_worker_libvirt_group
      - item.stat.mode == "0750"
  loop: "{{ live_vm_host_worker_socket_namespaces.results }}"

- name: Prove a worker cannot write protected socket namespaces
  ansible.builtin.command: "/usr/bin/test ! -w {{ item }}"
  become: true
  become_user: kdive-worker-1
  loop:
    - /run/kdive
    - /run/kdive/live-libvirt
    - /run/kdive/live-libvirt/libvirt
  changed_when: false

- name: Read every fixed worker account's groups
  ansible.builtin.command: "id -nG {{ item }}"
  loop: "{{ live_vm_host_worker_accounts }}"
  register: live_vm_host_worker_group_results
  changed_when: false
  failed_when: >-
    live_vm_host_worker_libvirt_group not in live_vm_host_worker_group_results.stdout.split()
    or 'kvm' not in live_vm_host_worker_group_results.stdout.split()
    or live_vm_host_worker_control_group in live_vm_host_worker_group_results.stdout.split()
    or live_vm_host_authority_client_group in live_vm_host_worker_group_results.stdout.split()
    or 'sudo' in live_vm_host_worker_group_results.stdout.split()
    or 'docker' in live_vm_host_worker_group_results.stdout.split()

- name: Read the reconciler denial-proof identity groups
  ansible.builtin.command: id -nG kdive
  register: live_vm_host_reconciler_group_result
  changed_when: false
  failed_when: >-
    live_vm_host_authority_client_group in live_vm_host_reconciler_group_result.stdout.split()

- name: Read the authority account groups
  ansible.builtin.command: "id -nG {{ live_vm_host_authority_account }}"
  register: live_vm_host_authority_group_result
  changed_when: false
  failed_when: >-
    live_vm_host_authority_client_group not in live_vm_host_authority_group_result.stdout.split()
    or live_vm_host_worker_libvirt_group in live_vm_host_authority_group_result.stdout.split()
    or 'kvm' in live_vm_host_authority_group_result.stdout.split()

- name: Assert every worker keeps only its own primary group
  ansible.builtin.command: "id -gn {{ item }}"
  loop: "{{ live_vm_host_worker_accounts }}"
  register: live_vm_host_worker_primary_group_results
  changed_when: false
  failed_when: live_vm_host_worker_primary_group_results.stdout != item

- name: Verify every fixed worker is a real isolated no-login account
  ansible.builtin.command: "getent passwd {{ item }}"
  loop: "{{ live_vm_host_worker_accounts }}"
  register: live_vm_host_worker_passwd_results
  changed_when: false
  failed_when: >-
    live_vm_host_worker_passwd_results.stdout.split(':')[0] != item
    or live_vm_host_worker_passwd_results.stdout.split(':')[5] != '/nonexistent'
    or live_vm_host_worker_passwd_results.stdout.split(':')[6] != '/usr/sbin/nologin'

- name: Read the control group's configured membership
  ansible.builtin.getent:
    database: group
    key: "{{ live_vm_host_worker_control_group }}"

- name: Assert only the configured operator is in the control group
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts.getent_group[live_vm_host_worker_control_group][2].split(',')
        | reject('equalto', '') | list == [github_runner_user]

- name: Inspect the installed lifecycle socket
  ansible.builtin.stat:
    path: /run/kdive/live-worker-lifecycle.sock
  register: live_vm_host_worker_socket

- name: Assert the installed lifecycle socket authority
  ansible.builtin.assert:
    that:
      - live_vm_host_worker_socket.stat.issock
      - live_vm_host_worker_socket.stat.pw_name == "root"
      - live_vm_host_worker_socket.stat.gr_name == live_vm_host_worker_control_group
      - live_vm_host_worker_socket.stat.mode == "0660"

- name: Assert the lifecycle socket is enabled
  ansible.builtin.systemd_service:
    name: kdive-live-worker-lifecycle.socket
  register: live_vm_host_worker_socket_service
  check_mode: true
  changed_when: false

- name: Check the lifecycle socket enabled state
  ansible.builtin.assert:
    that:
      - live_vm_host_worker_socket_service.status.UnitFileState == "enabled"
      - live_vm_host_worker_socket_service.status.ActiveState == "active"
      - live_vm_host_worker_socket_service.status.SubState == "listening"

- name: Inspect the root-only lifecycle files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/kdive/credentials/live-worker-witness.dsn
    - /etc/kdive/live-worker-lifecycle.conf
  register: live_vm_host_worker_root_files

- name: Assert the lifecycle files are root-only
  ansible.builtin.assert:
    that:
      - item.stat.pw_name == "root"
      - item.stat.gr_name == "root"
      - item.stat.mode == "0600"
  loop: "{{ live_vm_host_worker_root_files.results }}"

- name: Inspect the published worker libvirt URI
  ansible.builtin.stat:
    path: /etc/kdive/live-worker-libvirt.env
  register: live_vm_host_worker_libvirt_env_file

- name: Assert the worker libvirt URI is public and root-owned
  ansible.builtin.assert:
    that:
      - live_vm_host_worker_libvirt_env_file.stat.pw_name == "root"
      - live_vm_host_worker_libvirt_env_file.stat.gr_name == "root"
      - live_vm_host_worker_libvirt_env_file.stat.mode == "0644"

- name: Read the published worker libvirt URI
  ansible.builtin.slurp:
    path: /etc/kdive/live-worker-libvirt.env
  register: live_vm_host_worker_libvirt_env

- name: Assert the published worker libvirt URI matches the selected tuple
  ansible.builtin.assert:
    that:
      - >-
        (live_vm_host_worker_libvirt_env.content | b64decode)
        == 'KDIVE_LIBVIRT_URI=' + live_vm_host_worker_libvirt_uri + '\n'

- name: Inspect the installed lifecycle revision
  ansible.builtin.stat:
    path: /opt/kdive-live-worker-lifecycle/revision
  register: live_vm_host_worker_revision_file

- name: Assert the lifecycle revision stamp mode
  ansible.builtin.assert:
    that:
      - live_vm_host_worker_revision_file.stat.pw_name == "root"
      - live_vm_host_worker_revision_file.stat.gr_name == "root"
      - live_vm_host_worker_revision_file.stat.mode == "0444"

- name: Read the installed lifecycle revision
  ansible.builtin.slurp:
    path: /opt/kdive-live-worker-lifecycle/revision
  register: live_vm_host_worker_revision

- name: Assert the lifecycle revision matches the checkout
  ansible.builtin.assert:
    that:
      - (live_vm_host_worker_revision.content | b64decode | trim) == live_vm_host_checkout.after

- name: Verify the installed live-worker unit syntax
  ansible.builtin.command: >-
    systemd-analyze verify /etc/systemd/system/kdive-live-worker@.service
    /etc/systemd/system/kdive-live-worker-lifecycle.socket
    /etc/systemd/system/kdive-live-worker-lifecycle@.service
  changed_when: false

- name: Verify existing worker provider path remains usable after authority endpoint
  ansible.builtin.command: "virsh -c {{ live_vm_host_worker_libvirt_uri }} list"
  become: true
  become_user: kdive-worker-1
  changed_when: false

- name: Verify workers import the installed KDIVE revision
  ansible.builtin.command: >-
    /opt/kdive-live-worker-lifecycle/.venv/bin/python -c
    'import guestfs, pathlib, kdive; print(pathlib.Path(kdive.__file__).resolve())'
  become: true
  become_user: "{{ item }}"
  loop: "{{ live_vm_host_worker_accounts }}"
  register: live_vm_host_worker_import_results
  changed_when: false
  failed_when: >-
    not live_vm_host_worker_import_results.stdout.startswith(
    '/opt/kdive-live-worker-lifecycle/.venv/')

- name: Verify workers can access installed Python and provider paths
  ansible.builtin.command: >-
    /bin/sh -c 'test -x /opt/kdive-live-worker-lifecycle/.venv/bin/python
    && test -r {{ live_vm_host_worker_fixture_catalog }}
    && test -x {{ live_vm_host_worker_fixture_catalog }}
    && test -r {{ live_vm_host_worker_fixture_catalog }}/manifest.yaml
    && test -r {{ live_vm_host_worker_fixture_catalog }}/rootfs_catalog.toml
    && test -r
    {{ live_vm_host_worker_fixture_catalog }}/profiles/console-ready_ppc64le.yaml
    && test -r
    {{ live_vm_host_worker_fixture_catalog }}/profiles/console-ready_x86_64.yaml
    && test -w /var/lib/kdive/rootfs
    && test -x /var/lib/kdive/rootfs
    && test -w /var/lib/kdive/console
    && test -x /var/lib/kdive/console
    && test -w /var/lib/kdive/pcap
    && test -x /var/lib/kdive/pcap
    && test -w /var/lib/kdive/build
    && test -x /var/lib/kdive/build
    && test -w /var/lib/kdive/install
    && test -x /var/lib/kdive/install'
  become: true
  become_user: "{{ item }}"
  loop: "{{ live_vm_host_worker_accounts }}"
  changed_when: false

- name: Verify every worker can read every host kernel
  ansible.builtin.command: "/bin/sh -c 'test -r {{ item.1.path }}'"
  become: true
  become_user: "{{ item.0 }}"
  loop: >-
    {{ live_vm_host_worker_accounts | product(live_vm_host_boot_kernels.files) | list }}
  loop_control:
    label: "{{ item.0 }} -> {{ item.1.path }}"
  changed_when: false

- name: Verify every worker can use the KVM device
  ansible.builtin.command: "/bin/sh -c 'test -r /dev/kvm && test -w /dev/kvm'"
  become: true
  become_user: "{{ item }}"
  loop: "{{ live_vm_host_worker_accounts }}"
  changed_when: false

- name: Verify the selected session libvirtd process is live
  ansible.builtin.command: >-
    pgrep --uid {{ github_runner_user }} --exact libvirtd
    --pidfile /run/kdive/live-libvirt/libvirt/libvirtd.pid
  changed_when: false

- name: Inspect the selected session libvirt socket
  ansible.builtin.stat:
    path: /run/kdive/live-libvirt/libvirt/libvirt-sock
  register: live_vm_host_worker_libvirt_socket

- name: Assert the selected session libvirt socket authority
  ansible.builtin.assert:
    that:
      - live_vm_host_worker_libvirt_socket.stat.issock
      - live_vm_host_worker_libvirt_socket.stat.pw_name == github_runner_user
      - live_vm_host_worker_libvirt_socket.stat.gr_name == live_vm_host_worker_libvirt_group
      - live_vm_host_worker_libvirt_socket.stat.mode == "0770"

- name: Inspect authority protected paths
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - /opt/kdive-provider-authority
    - /etc/kdive/credentials/provider-authority
    - /var/lib/kdive/provider-authority
    - /var/lib/kdive/provider-authority/journal
    - /run/kdive/provider-authority
    - /run/kdive/provider-authority/request
    - /run/kdive/provider-authority/libvirt
  register: live_vm_host_authority_protected_path_results

- name: Assert authority protected path ownership
  ansible.builtin.assert:
    that:
      - item.stat.isdir
      - not item.stat.islnk
      - item.stat.pw_name == live_vm_host_authority_account
      - >-
        (
        item.stat.mode == '0700'
        and item.stat.gr_name == live_vm_host_authority_account
        )
        or (
        item.item in [
        '/run/kdive/provider-authority',
        '/run/kdive/provider-authority/request'
        ]
        and (
        (item.item == '/run/kdive/provider-authority' and item.stat.mode == '0710')
        or (item.item == '/run/kdive/provider-authority/request' and item.stat.mode == '0750')
        )
        and item.stat.gr_name == live_vm_host_authority_client_group
        )
  loop: "{{ live_vm_host_authority_protected_path_results.results }}"

- name: Inspect the authority libvirt configuration
  ansible.builtin.stat:
    path: /etc/kdive/libvirtd-external-boot-authority.conf
  register: live_vm_host_authority_libvirt_config

- name: Assert the authority libvirt configuration is protected
  ansible.builtin.assert:
    that:
      - live_vm_host_authority_libvirt_config.stat.isreg
      - not live_vm_host_authority_libvirt_config.stat.islnk
      - live_vm_host_authority_libvirt_config.stat.pw_name == 'root'
      - >-
        live_vm_host_authority_libvirt_config.stat.gr_name
        == live_vm_host_authority_account
      - live_vm_host_authority_libvirt_config.stat.mode == '0640'

- name: Verify the dormant authority session libvirtd process is live
  ansible.builtin.command: >-
    pgrep --uid {{ live_vm_host_authority_account }} --exact libvirtd
    --pidfile /run/kdive/provider-authority/libvirt/libvirtd.pid
  changed_when: false

- name: Verify the authority session-libvirtd user unit syntax
  ansible.builtin.command: >-
    systemd-analyze verify
    {{ live_vm_host_authority_home
    }}/.config/systemd/user/kdive-libvirtd-external-boot-authority.service
  changed_when: false

- name: Inspect the dormant authority session libvirt socket
  ansible.builtin.stat:
    path: /run/kdive/provider-authority/libvirt/libvirt-sock
    follow: false
  register: live_vm_host_authority_libvirt_socket

- name: Assert the dormant authority endpoint is distinct and reachable
  ansible.builtin.assert:
    that:
      - live_vm_host_authority_libvirt_uri != live_vm_host_worker_libvirt_uri
      - live_vm_host_authority_libvirt_socket.stat.issock
      - not live_vm_host_authority_libvirt_socket.stat.islnk
      - live_vm_host_authority_libvirt_socket.stat.pw_name == live_vm_host_authority_account
      - live_vm_host_authority_libvirt_socket.stat.gr_name == live_vm_host_authority_account
      - live_vm_host_authority_libvirt_socket.stat.mode == '0700'

- name: Verify the authority can use only its dormant provider endpoint
  ansible.builtin.command: "virsh -c {{ live_vm_host_authority_libvirt_uri }} list --name"
  become: true
  become_user: "{{ live_vm_host_authority_account }}"
  register: live_vm_host_authority_domains
  changed_when: false
  failed_when: live_vm_host_authority_domains.stdout | trim | length > 0

- name: Prove fixed workers and the reconciler cannot traverse authority paths
  ansible.builtin.command: "/usr/bin/test ! -x {{ item.1 }}"
  become: true
  become_user: "{{ item.0 }}"
  loop: >-
    {{ (live_vm_host_worker_accounts + ['kdive'])
    | product(live_vm_host_authority_denied_paths) | list }}
  loop_control:
    label: "{{ item.0 }} -> {{ item.1 }}"
  changed_when: false

- name: Prove fixed workers and the reconciler cannot access the authority mutation socket
  ansible.builtin.command: >-
    /usr/bin/test ! -r /run/kdive/provider-authority/libvirt/libvirt-sock
  become: true
  become_user: "{{ item }}"
  loop: "{{ live_vm_host_worker_accounts + ['kdive'] }}"
  changed_when: false

- name: Prove fixed workers and the reconciler cannot read the authority provider config
  ansible.builtin.command: >-
    /usr/bin/test ! -r /etc/kdive/libvirtd-external-boot-authority.conf
  become: true
  become_user: "{{ item }}"
  loop: "{{ live_vm_host_worker_accounts + ['kdive'] }}"
  changed_when: false

- name: Prove fixed workers and the reconciler cannot access authority provider objects
  ansible.builtin.command: "virsh -c {{ live_vm_host_authority_libvirt_uri }} list"
  become: true
  become_user: "{{ item }}"
  loop: "{{ live_vm_host_worker_accounts + ['kdive'] }}"
  register: live_vm_host_authority_denied_virsh_results
  changed_when: false
  failed_when: live_vm_host_authority_denied_virsh_results.rc == 0

- name: Assert the authority service is ready
  ansible.builtin.systemd_service:
    name: kdive-external-boot-authority.service
  register: live_vm_host_authority_service
  check_mode: true
  changed_when: false
  failed_when: >-
    live_vm_host_authority_service.status.ActiveState != 'active'
    or live_vm_host_authority_service.status.SubState != 'running'

- name: Inspect the installed authority credentials
  ansible.builtin.stat:
    path: "{{ live_vm_host_authority_credentials_dir }}/{{ item }}"
    follow: false
  loop:
    - database-dsn
    - service-credential
    - server-certificate
    - server-ca
    - worker-client-ca
    - health-client-certificate
    - health-client-key
  register: live_vm_host_authority_credential_results

- name: Assert the authority credential boundary
  ansible.builtin.assert:
    that:
      - item.stat.isreg
      - not item.stat.islnk
      - item.stat.pw_name == live_vm_host_authority_account
      - item.stat.gr_name == live_vm_host_authority_account
      - item.stat.mode == '0400'
  loop: "{{ live_vm_host_authority_credential_results.results }}"

- name: Read the installed authority revision
  ansible.builtin.slurp:
    path: "{{ live_vm_host_authority_runtime_install }}/revision"
  register: live_vm_host_authority_revision

- name: Assert the installed authority revision is exact
  ansible.builtin.assert:
    that:
      - (live_vm_host_authority_revision.content | b64decode | trim) == live_vm_host_checkout.after

- name: Assert the authority database LOGIN is least privilege
  ansible.builtin.command: >-
    {{ live_vm_host_authority_runtime_install }}/.venv/bin/python -m kdive
    check-external-boot-authority-host
  environment:
    CREDENTIALS_DIRECTORY: "{{ live_vm_host_authority_credentials_dir }}"
    KDIVE_EXTERNAL_BOOT_AUTHORITY_INSTANCE: "{{ live_vm_host_authority_instance }}"
    KDIVE_EXTERNAL_BOOT_AUTHORITY_UID: "{{ live_vm_host_authority_uid }}"
    KDIVE_EXTERNAL_BOOT_AUTHORITY_JOURNAL_DIR: /var/lib/kdive/provider-authority/journal
    KDIVE_EXTERNAL_BOOT_AUTHORITY_REQUEST_SOCKET: /run/kdive/provider-authority/request/authority.sock
    KDIVE_EXTERNAL_BOOT_AUTHORITY_PROVIDER_SOCKET: /run/kdive/provider-authority/libvirt/libvirt-sock
  become: true
  become_user: "{{ live_vm_host_authority_account }}"
  changed_when: false

- name: Prove authority service restart restores readiness
  when: live_vm_host_authority_proof_enabled | bool
  block:
    - name: Restart the external-boot authority service
      ansible.builtin.systemd_service:
        name: kdive-external-boot-authority.service
        state: restarted

    - name: Recheck authority readiness after restart
      ansible.builtin.command: >-
        {{ live_vm_host_authority_runtime_install }}/.venv/bin/python -m kdive
        check-external-boot-authority-host
      environment:
        CREDENTIALS_DIRECTORY: "{{ live_vm_host_authority_credentials_dir }}"
        KDIVE_EXTERNAL_BOOT_AUTHORITY_INSTANCE: "{{ live_vm_host_authority_instance }}"
        KDIVE_EXTERNAL_BOOT_AUTHORITY_UID: "{{ live_vm_host_authority_uid }}"
        KDIVE_EXTERNAL_BOOT_AUTHORITY_JOURNAL_DIR: /var/lib/kdive/provider-authority/journal
        KDIVE_EXTERNAL_BOOT_AUTHORITY_REQUEST_SOCKET: /run/kdive/provider-authority/request/authority.sock
        KDIVE_EXTERNAL_BOOT_AUTHORITY_PROVIDER_SOCKET: /run/kdive/provider-authority/libvirt/libvirt-sock
      become: true
      become_user: "{{ live_vm_host_authority_account }}"
      changed_when: false

- name: Prove journal restoration gates authority readiness
  when: live_vm_host_authority_proof_enabled | bool
  block:
    - name: Create a proof-only unexpected journal lane
      ansible.builtin.file:
        path: /var/lib/kdive/provider-authority/journal/not-a-system
        state: directory
        owner: "{{ live_vm_host_authority_account }}"
        group: "{{ live_vm_host_authority_account }}"
        mode: "0700"

    - name: Require the unexpected journal lane to fail readiness
      ansible.builtin.command: >-
        {{ live_vm_host_authority_runtime_install }}/.venv/bin/python -m kdive
        check-external-boot-authority-host
      environment:
        CREDENTIALS_DIRECTORY: "{{ live_vm_host_authority_credentials_dir }}"
        KDIVE_EXTERNAL_BOOT_AUTHORITY_INSTANCE: "{{ live_vm_host_authority_instance }}"
        KDIVE_EXTERNAL_BOOT_AUTHORITY_UID: "{{ live_vm_host_authority_uid }}"
        KDIVE_EXTERNAL_BOOT_AUTHORITY_JOURNAL_DIR: /var/lib/kdive/provider-authority/journal
        KDIVE_EXTERNAL_BOOT_AUTHORITY_REQUEST_SOCKET: /run/kdive/provider-authority/request/authority.sock
        KDIVE_EXTERNAL_BOOT_AUTHORITY_PROVIDER_SOCKET: /run/kdive/provider-authority/libvirt/libvirt-sock
      become: true
      become_user: "{{ live_vm_host_authority_account }}"
      register: live_vm_host_authority_bad_journal_probe
      changed_when: false
      failed_when: live_vm_host_authority_bad_journal_probe.rc == 0

    - name: Remove the proof-only unexpected journal lane
      ansible.builtin.file:
        path: /var/lib/kdive/provider-authority/journal/not-a-system
        state: absent

- name: Prove authority readiness retracts on credential and ACL drift
  when: live_vm_host_authority_proof_enabled | bool
  block:
    - name: Inject proof-only request-directory ACL drift
      ansible.builtin.file:
        path: /run/kdive/provider-authority/request
        state: directory
        owner: "{{ live_vm_host_authority_account }}"
        group: "{{ live_vm_host_authority_client_group }}"
        mode: "0770"

    - name: Wait for periodic readiness to observe ACL drift
      ansible.builtin.wait_for:
        timeout: 35

    - name: Require authority readiness to retract on ACL drift
      ansible.builtin.systemd_service:
        name: kdive-external-boot-authority.service
      register: live_vm_host_authority_acl_drift_state
      check_mode: true
      changed_when: false

    - name: Assert ACL drift retracted authority readiness
      ansible.builtin.assert:
        that:
          - live_vm_host_authority_acl_drift_state.status.ActiveState != 'active'

    - name: Restore the request-directory ACL
      ansible.builtin.file:
        path: /run/kdive/provider-authority/request
        state: directory
        owner: "{{ live_vm_host_authority_account }}"
        group: "{{ live_vm_host_authority_client_group }}"
        mode: "0750"

    - name: Save the valid proof server certificate
      ansible.builtin.copy:
        src: "{{ live_vm_host_authority_credentials_dir }}/server-certificate"
        dest: "{{ live_vm_host_authority_credentials_dir }}/server-certificate.proof-backup"
        remote_src: true
        owner: root
        group: root
        mode: "0400"

    - name: Inject proof-only TLS credential drift
      ansible.builtin.copy:
        dest: "{{ live_vm_host_authority_credentials_dir }}/server-certificate"
        content: "invalid proof certificate\n"
        owner: "{{ live_vm_host_authority_account }}"
        group: "{{ live_vm_host_authority_account }}"
        mode: "0400"

    - name: Require TLS drift to prevent service readiness
      ansible.builtin.systemd_service:
        name: kdive-external-boot-authority.service
        state: restarted
      register: live_vm_host_authority_tls_drift_restart
      failed_when: false

    - name: Inspect authority service after TLS drift
      ansible.builtin.systemd_service:
        name: kdive-external-boot-authority.service
      register: live_vm_host_authority_tls_drift_state
      check_mode: true
      changed_when: false

    - name: Assert TLS drift retracted authority readiness
      ansible.builtin.assert:
        that:
          - live_vm_host_authority_tls_drift_state.status.ActiveState != 'active'

    - name: Restore the valid proof server certificate
      ansible.builtin.copy:
        src: "{{ live_vm_host_authority_credentials_dir }}/server-certificate.proof-backup"
        dest: "{{ live_vm_host_authority_credentials_dir }}/server-certificate"
        remote_src: true
        owner: "{{ live_vm_host_authority_account }}"
        group: "{{ live_vm_host_authority_account }}"
        mode: "0400"

    - name: Remove the proof server certificate backup
      ansible.builtin.file:
        path: "{{ live_vm_host_authority_credentials_dir }}/server-certificate.proof-backup"
        state: absent

    - name: Restore authority readiness after drift proofs
      ansible.builtin.systemd_service:
        name: kdive-external-boot-authority.service
        state: restarted

- name: Create root-owned permission-probe markers for every slot
  ansible.builtin.copy:
    dest: >-
      {{ live_vm_host_worker_state_root }}/slots/{{
      item | regex_replace('^kdive-worker-', '') }}/permission-probe
    content: "slot permission probe\n"
    owner: root
    group: "{{ item }}"
    mode: "0440"
  loop: "{{ live_vm_host_worker_accounts }}"

- name: Create worker-owned replacement candidates
  ansible.builtin.copy:
    dest: "/tmp/kdive-live-worker-{{ item }}-permission-probe"
    content: "untrusted replacement\n"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0600"
  loop: "{{ live_vm_host_worker_accounts }}"

- name: Prove each slot account can read its own marker
  ansible.builtin.command: >-
    /usr/bin/test -r {{ live_vm_host_worker_state_root }}/slots/{{
    item | regex_replace('^kdive-worker-', '') }}/permission-probe
  become: true
  become_user: "{{ item }}"
  loop: "{{ live_vm_host_worker_accounts }}"
  changed_when: false

- name: Prove each slot account cannot replace its own marker
  ansible.builtin.command: >-
    /usr/bin/mv /tmp/kdive-live-worker-{{ item }}-permission-probe
    {{ live_vm_host_worker_state_root }}/slots/{{
    item | regex_replace('^kdive-worker-', '') }}/permission-probe
  become: true
  become_user: "{{ item }}"
  loop: "{{ live_vm_host_worker_accounts }}"
  register: live_vm_host_worker_own_replace
  changed_when: false
  failed_when: live_vm_host_worker_own_replace.rc == 0

- name: Prove each slot account cannot traverse any sibling slot
  ansible.builtin.command: >-
    /usr/bin/test ! -x {{ live_vm_host_worker_state_root }}/slots/{{ item.1 }}
  become: true
  become_user: "{{ item.0 }}"
  loop: "{{ query('nested', live_vm_host_worker_accounts, range(1, 9) | list) }}"
  loop_control:
    label: "{{ item.0 }} -> slot {{ item.1 }}"
  when: (item.0 | regex_replace('^kdive-worker-', '') | int) != item.1
  changed_when: false

- name: Prove each slot account cannot read any sibling marker
  ansible.builtin.command: >-
    /usr/bin/test ! -r {{ live_vm_host_worker_state_root }}/slots/{{ item.1 }}/permission-probe
  become: true
  become_user: "{{ item.0 }}"
  loop: "{{ query('nested', live_vm_host_worker_accounts, range(1, 9) | list) }}"
  loop_control:
    label: "{{ item.0 }} -> slot {{ item.1 }}"
  when: (item.0 | regex_replace('^kdive-worker-', '') | int) != item.1
  changed_when: false

- name: Prove each slot account cannot replace any sibling marker
  ansible.builtin.command: >-
    /usr/bin/mv /tmp/kdive-live-worker-{{ item.0 }}-permission-probe
    {{ live_vm_host_worker_state_root }}/slots/{{ item.1 }}/permission-probe
  become: true
  become_user: "{{ item.0 }}"
  loop: "{{ query('nested', live_vm_host_worker_accounts, range(1, 9) | list) }}"
  loop_control:
    label: "{{ item.0 }} -> slot {{ item.1 }}"
  register: live_vm_host_worker_sibling_replace
  when: (item.0 | regex_replace('^kdive-worker-', '') | int) != item.1
  changed_when: false
  failed_when: live_vm_host_worker_sibling_replace.rc == 0

- name: Remove the root-owned permission-probe markers
  ansible.builtin.file:
    path: >-
      {{ live_vm_host_worker_state_root }}/slots/{{
      item | regex_replace('^kdive-worker-', '') }}/permission-probe
    state: absent
  loop: "{{ live_vm_host_worker_accounts }}"

- name: Remove the worker-owned permission-probe candidates
  ansible.builtin.file:
    path: "/tmp/kdive-live-worker-{{ item }}-permission-probe"
    state: absent
  loop: "{{ live_vm_host_worker_accounts }}"
