---
# Resolve the service-account uid up front; ansible_facts.getent_passwd is populated only
# after this task runs (gather_facts does NOT populate it), and the /run/user path needs it.
- name: Look up the service account's passwd entry
  ansible.builtin.getent:
    database: passwd
    key: "{{ github_runner_user }}"

- name: Record the service-account uid
  ansible.builtin.set_fact:
    live_vm_host_uid: "{{ ansible_facts.getent_passwd[github_runner_user][1] }}"

# Part 1: check-local-libvirt.sh (KVM / daemons / venv-import / network / install-staging
# writability / /boot readability), run AS the service account after a connection reset so the
# just-added kvm/libvirt group membership is live, with KDIVE_PYTHON pointing at the venv.
- name: Reset the connection so new group membership is read
  ansible.builtin.meta: reset_connection

- name: Run check-local-libvirt.sh as the service account
  ansible.builtin.command: ./scripts/check-local-libvirt.sh
  args:
    chdir: "{{ live_vm_venv }}"
  environment:
    KDIVE_PYTHON: "{{ live_vm_venv }}/.venv/bin/python"
    KDIVE_INSTALL_STAGING: "{{ install_staging_dir }}"
  become: true
  become_user: "{{ github_runner_user }}"
  changed_when: false

# Part 2: the delta check-local-libvirt.sh does not cover. On the Ubuntu target there is no
# static disk label to assert (AppArmor/virt-aa-helper permits each domain's disk paths
# dynamically), so the gate verifies group membership and the short XDG_RUNTIME_DIR directly.
- name: Assert the service account is in kvm and libvirt
  ansible.builtin.command: "id -nG {{ github_runner_user }}"
  register: live_vm_host_groups
  changed_when: false
  failed_when: >-
    'kvm' not in live_vm_host_groups.stdout.split()
    or 'libvirt' not in live_vm_host_groups.stdout.split()

- name: Assert /run/user/<uid> exists for the service account
  ansible.builtin.stat:
    path: "/run/user/{{ live_vm_host_uid }}"
  register: live_vm_host_xdg
  failed_when: not live_vm_host_xdg.stat.exists

- name: Read every fixed worker account's groups
  ansible.builtin.command: "id -nG {{ item }}"
  loop: "{{ live_vm_host_worker_accounts }}"
  register: live_vm_host_worker_group_results
  changed_when: false
  failed_when: >-
    live_vm_host_worker_libvirt_group not in live_vm_host_worker_group_results.stdout.split()
    or live_vm_host_worker_control_group in live_vm_host_worker_group_results.stdout.split()
    or 'sudo' in live_vm_host_worker_group_results.stdout.split()
    or 'docker' in live_vm_host_worker_group_results.stdout.split()

- name: Assert every worker keeps only its own primary group
  ansible.builtin.command: "id -gn {{ item }}"
  loop: "{{ live_vm_host_worker_accounts }}"
  register: live_vm_host_worker_primary_group_results
  changed_when: false
  failed_when: live_vm_host_worker_primary_group_results.stdout != item

- name: Read the control group's configured membership
  ansible.builtin.getent:
    database: group
    key: "{{ live_vm_host_worker_control_group }}"

- name: Assert only the configured operator is in the control group
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts.getent_group[live_vm_host_worker_control_group][2].split(',')
        | reject('equalto', '') | list == [github_runner_user]

- name: Inspect the installed lifecycle socket
  ansible.builtin.stat:
    path: /run/kdive/live-worker-lifecycle.sock
  register: live_vm_host_worker_socket

- name: Assert the installed lifecycle socket authority
  ansible.builtin.assert:
    that:
      - live_vm_host_worker_socket.stat.issock
      - live_vm_host_worker_socket.stat.pw_name == "root"
      - live_vm_host_worker_socket.stat.gr_name == live_vm_host_worker_control_group
      - live_vm_host_worker_socket.stat.mode == "0660"

- name: Assert the lifecycle socket is enabled
  ansible.builtin.systemd_service:
    name: kdive-live-worker-lifecycle.socket
  register: live_vm_host_worker_socket_service
  check_mode: true
  changed_when: false

- name: Check the lifecycle socket enabled state
  ansible.builtin.assert:
    that: live_vm_host_worker_socket_service.status.UnitFileState == "enabled"

- name: Inspect the root-only lifecycle files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/kdive/credentials/live-worker-witness.dsn
    - /etc/kdive/live-worker-lifecycle.conf
  register: live_vm_host_worker_root_files

- name: Assert the lifecycle files are root-only
  ansible.builtin.assert:
    that:
      - item.stat.pw_name == "root"
      - item.stat.gr_name == "root"
      - item.stat.mode == "0600"
  loop: "{{ live_vm_host_worker_root_files.results }}"

- name: Inspect the published worker libvirt URI
  ansible.builtin.stat:
    path: /etc/kdive/live-worker-libvirt.env
  register: live_vm_host_worker_libvirt_env_file

- name: Assert the worker libvirt URI is public and root-owned
  ansible.builtin.assert:
    that:
      - live_vm_host_worker_libvirt_env_file.stat.pw_name == "root"
      - live_vm_host_worker_libvirt_env_file.stat.gr_name == "root"
      - live_vm_host_worker_libvirt_env_file.stat.mode == "0644"

- name: Read the published worker libvirt URI
  ansible.builtin.slurp:
    path: /etc/kdive/live-worker-libvirt.env
  register: live_vm_host_worker_libvirt_env

- name: Assert the published worker libvirt URI matches the selected tuple
  ansible.builtin.assert:
    that:
      - >-
        (live_vm_host_worker_libvirt_env.content | b64decode)
        == 'KDIVE_LIBVIRT_URI=' + live_vm_host_worker_libvirt_uri + '\n'

- name: Inspect the installed lifecycle revision
  ansible.builtin.stat:
    path: /opt/kdive-live-worker-lifecycle/revision
  register: live_vm_host_worker_revision_file

- name: Assert the lifecycle revision stamp mode
  ansible.builtin.assert:
    that:
      - live_vm_host_worker_revision_file.stat.pw_name == "root"
      - live_vm_host_worker_revision_file.stat.gr_name == "root"
      - live_vm_host_worker_revision_file.stat.mode == "0444"

- name: Read the installed lifecycle revision
  ansible.builtin.slurp:
    path: /opt/kdive-live-worker-lifecycle/revision
  register: live_vm_host_worker_revision

- name: Assert the lifecycle revision matches the checkout
  ansible.builtin.assert:
    that:
      - (live_vm_host_worker_revision.content | b64decode | trim) == live_vm_host_checkout.after

- name: Verify the installed live-worker unit syntax
  ansible.builtin.command: >-
    systemd-analyze verify /etc/systemd/system/kdive-live-worker@.service
    /etc/systemd/system/kdive-live-worker-lifecycle.socket
    /etc/systemd/system/kdive-live-worker-lifecycle@.service
  changed_when: false

- name: Verify shared session libvirt is readable as slot one
  ansible.builtin.command: "virsh -c {{ live_vm_host_worker_libvirt_uri }} list"
  become: true
  become_user: kdive-worker-1
  changed_when: false

- name: Verify the selected session libvirtd process is live
  ansible.builtin.command: >-
    pgrep --uid {{ github_runner_user }} --exact libvirtd
    --pidfile /run/kdive/live-libvirt/libvirt/libvirtd.pid
  changed_when: false

- name: Inspect the selected session libvirt socket
  ansible.builtin.stat:
    path: /run/kdive/live-libvirt/libvirt/libvirt-sock
  register: live_vm_host_worker_libvirt_socket

- name: Assert the selected session libvirt socket authority
  ansible.builtin.assert:
    that:
      - live_vm_host_worker_libvirt_socket.stat.issock
      - live_vm_host_worker_libvirt_socket.stat.pw_name == github_runner_user
      - live_vm_host_worker_libvirt_socket.stat.gr_name == live_vm_host_worker_libvirt_group
      - live_vm_host_worker_libvirt_socket.stat.mode == "0770"

- name: Create root-owned permission-probe markers for every slot
  ansible.builtin.copy:
    dest: >-
      {{ live_vm_host_worker_state_root }}/slots/{{
      item | regex_replace('^kdive-worker-', '') }}/permission-probe
    content: "slot permission probe\n"
    owner: root
    group: "{{ item }}"
    mode: "0440"
  loop: "{{ live_vm_host_worker_accounts }}"

- name: Create worker-owned replacement candidates
  ansible.builtin.copy:
    dest: "/tmp/kdive-live-worker-{{ item }}-permission-probe"
    content: "untrusted replacement\n"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0600"
  loop: "{{ live_vm_host_worker_accounts }}"

- name: Prove each slot account can read its own marker
  ansible.builtin.command: >-
    /usr/bin/test -r {{ live_vm_host_worker_state_root }}/slots/{{
    item | regex_replace('^kdive-worker-', '') }}/permission-probe
  become: true
  become_user: "{{ item }}"
  loop: "{{ live_vm_host_worker_accounts }}"
  changed_when: false

- name: Prove each slot account cannot replace its own marker
  ansible.builtin.command: >-
    /usr/bin/mv /tmp/kdive-live-worker-{{ item }}-permission-probe
    {{ live_vm_host_worker_state_root }}/slots/{{
    item | regex_replace('^kdive-worker-', '') }}/permission-probe
  become: true
  become_user: "{{ item }}"
  loop: "{{ live_vm_host_worker_accounts }}"
  register: live_vm_host_worker_own_replace
  changed_when: false
  failed_when: live_vm_host_worker_own_replace.rc == 0

- name: Prove each slot account cannot traverse its sibling slot
  ansible.builtin.command: >-
    /usr/bin/test ! -x {{ live_vm_host_worker_state_root }}/slots/{{ (slot_index + 1) % 8 + 1 }}
  become: true
  become_user: "{{ item }}"
  loop: "{{ live_vm_host_worker_accounts }}"
  loop_control:
    index_var: slot_index
  changed_when: false

- name: Prove each slot account cannot read its sibling marker
  ansible.builtin.command: >-
    /usr/bin/test ! -r {{ live_vm_host_worker_state_root }}/slots/{{
    (slot_index + 1) % 8 + 1 }}/permission-probe
  become: true
  become_user: "{{ item }}"
  loop: "{{ live_vm_host_worker_accounts }}"
  loop_control:
    index_var: slot_index
  changed_when: false

- name: Prove each slot account cannot replace its sibling marker
  ansible.builtin.command: >-
    /usr/bin/mv /tmp/kdive-live-worker-{{ item }}-permission-probe
    {{ live_vm_host_worker_state_root }}/slots/{{ (slot_index + 1) % 8 + 1 }}/permission-probe
  become: true
  become_user: "{{ item }}"
  loop: "{{ live_vm_host_worker_accounts }}"
  loop_control:
    index_var: slot_index
  register: live_vm_host_worker_sibling_replace
  changed_when: false
  failed_when: live_vm_host_worker_sibling_replace.rc == 0

- name: Remove the root-owned permission-probe markers
  ansible.builtin.file:
    path: >-
      {{ live_vm_host_worker_state_root }}/slots/{{
      item | regex_replace('^kdive-worker-', '') }}/permission-probe
    state: absent
  loop: "{{ live_vm_host_worker_accounts }}"

- name: Remove the worker-owned permission-probe candidates
  ansible.builtin.file:
    path: "/tmp/kdive-live-worker-{{ item }}-permission-probe"
    state: absent
  loop: "{{ live_vm_host_worker_accounts }}"
