---
- name: Require the complete fixed-worker authority client contract
  ansible.builtin.assert:
    that:
      - live_vm_host_authority_enabled | bool
      - item | length > 0
    quiet: true
  loop:
    - "{{ live_vm_host_worker_authority_instance }}"
    - "{{ live_vm_host_worker_authority_request_socket }}"
    - "{{ live_vm_host_worker_authority_server_ca_source }}"
    - "{{ live_vm_host_worker_authority_client_certificate_source }}"
    - "{{ live_vm_host_worker_authority_client_key_source }}"
  when: live_vm_host_worker_authority_enabled | bool
  no_log: true

- name: Inspect fixed-worker authority client sources on the control host
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ live_vm_host_worker_authority_server_ca_source }}"
    - "{{ live_vm_host_worker_authority_client_certificate_source }}"
    - "{{ live_vm_host_worker_authority_client_key_source }}"
  delegate_to: localhost
  become: false
  register: live_vm_host_worker_authority_source_preflight
  when: live_vm_host_worker_authority_enabled | bool
  no_log: true

- name: Require protected regular fixed-worker authority client sources
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
      - item.stat.mode in ['0400', '0600']
      - item.stat.size > 0
    quiet: true
  loop: "{{ live_vm_host_worker_authority_source_preflight.results }}"
  when: live_vm_host_worker_authority_enabled | bool
  no_log: true

- name: Validate external-boot authority inputs before host mutation
  when: live_vm_host_authority_enabled | bool
  block:
    - name: Require the complete external-boot authority source contract
      ansible.builtin.assert:
        that:
          - item | length > 0
        fail_msg: >-
          Authority installation is enabled, but its complete database and TLS source contract
          was not supplied. Provide the protected authority vars file described in the runner
          runbook before provisioning.
        quiet: true
      loop:
        - "{{ live_vm_host_authority_database_dsn_source }}"
        - "{{ live_vm_host_authority_server_key_source }}"
        - "{{ live_vm_host_authority_server_certificate_source }}"
        - "{{ live_vm_host_authority_server_ca_source }}"
        - "{{ live_vm_host_authority_worker_client_ca_source }}"
        - "{{ live_vm_host_authority_health_client_certificate_source }}"
        - "{{ live_vm_host_authority_health_client_key_source }}"
      no_log: true

    - name: Validate the closed local-mutation authority contract
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import json, re, sys
            from pathlib import PurePosixPath
            from urllib.parse import urlsplit
            value = json.load(sys.stdin)
            enabled = value['enabled']
            assert type(enabled) is bool
            mutation = value['mutation']
            if not enabled:
                assert mutation is False
            if mutation:
                assert type(value['capacity']) is int and value['capacity'] > 0
                endpoint = urlsplit(value['endpoint'])
                assert endpoint.scheme in ('http', 'https') and endpoint.netloc
                assert not endpoint.username and not endpoint.password and not endpoint.fragment
                assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,254}', value['bucket'])
                assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,254}', value['region'])
                assert value['credentials'].startswith('/')
                for raw in value['paths']:
                    path = PurePosixPath(raw)
                    assert path.is_absolute() and '..' not in path.parts
            else:
                assert value['capacity'] is None
                assert value['endpoint'] == '' and value['bucket'] == ''
                assert value['credentials'] == ''
        stdin: >-
          {{ {'enabled': live_vm_host_authority_enabled,
              'mutation': live_vm_host_authority_local_mutation_enabled,
              'capacity': live_vm_host_authority_external_boot_capacity_bytes,
              'endpoint': live_vm_host_authority_s3_endpoint_url,
              'bucket': live_vm_host_authority_s3_bucket,
              'region': live_vm_host_authority_s3_region,
              'credentials': live_vm_host_authority_s3_credentials_source,
              'paths': [live_vm_host_authority_recovery_root,
                        live_vm_host_authority_rootfs_root,
                        live_vm_host_authority_console_root]} | to_json }}
      changed_when: false
      check_mode: false

    - name: Inspect the local-mutation S3 credential source
      ansible.builtin.stat:
        path: "{{ live_vm_host_authority_s3_credentials_source }}"
        follow: false
      delegate_to: localhost
      become: false
      register: live_vm_host_authority_s3_source_preflight
      when: live_vm_host_authority_local_mutation_enabled | bool
      no_log: true

    - name: Require a protected local-mutation S3 credential source
      ansible.builtin.assert:
        that:
          - live_vm_host_authority_s3_source_preflight.stat.exists
          - live_vm_host_authority_s3_source_preflight.stat.isreg
          - not live_vm_host_authority_s3_source_preflight.stat.islnk
          - live_vm_host_authority_s3_source_preflight.stat.mode in ['0400', '0600']
          - live_vm_host_authority_s3_source_preflight.stat.size > 0
        quiet: true
      when: live_vm_host_authority_local_mutation_enabled | bool
      no_log: true

    - name: Inspect external-boot authority sources on the control host
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ live_vm_host_authority_database_dsn_source }}"
        - "{{ live_vm_host_authority_server_key_source }}"
        - "{{ live_vm_host_authority_server_certificate_source }}"
        - "{{ live_vm_host_authority_server_ca_source }}"
        - "{{ live_vm_host_authority_worker_client_ca_source }}"
        - "{{ live_vm_host_authority_health_client_certificate_source }}"
        - "{{ live_vm_host_authority_health_client_key_source }}"
      delegate_to: localhost
      become: false
      register: live_vm_host_authority_source_preflight
      no_log: true

    - name: Require protected regular external-boot authority source files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - not item.stat.islnk
          - item.stat.mode in ['0400', '0600']
        fail_msg: >-
          Every authority source must be a mode-0400 or mode-0600 regular file on the control
          host. No runner-host changes were made.
        quiet: true
      loop: "{{ live_vm_host_authority_source_preflight.results }}"
      no_log: true

    - name: Require complete transient proof inputs when proof is enabled
      ansible.builtin.assert:
        that:
          - item | length > 0
        fail_msg: >-
          The transient authority proof requires its administrative DSN, client material,
          worker credential, and request before provisioning starts.
        quiet: true
      loop:
        - "{{ live_vm_host_authority_database_admin_dsn }}"
        - "{{ live_vm_host_authority_proof_client_certificate }}"
        - "{{ live_vm_host_authority_proof_client_key }}"
        - "{{ live_vm_host_authority_proof_worker_credential }}"
        - "{{ live_vm_host_authority_proof_request }}"
      when: live_vm_host_authority_proof_enabled | bool
      no_log: true
