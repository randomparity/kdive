---
# Install the external-boot authority credentials. main.yml and
# renew-local-authority-tls.yml import this same task (ADR-0803).
- name: Install external-boot authority credentials
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "{{ live_vm_host_authority_credentials_dir }}/{{ item.name }}"
    owner: "{{ live_vm_host_authority_account }}"
    group: "{{ live_vm_host_authority_account }}"
    mode: "0400"
  loop:
    - {name: database-dsn, source: "{{ live_vm_host_authority_database_dsn_source }}"}
    - {name: service-credential, source: "{{ live_vm_host_authority_server_key_source }}"}
    - {name: server-certificate, source: "{{ live_vm_host_authority_server_certificate_source }}"}
    - {name: server-ca, source: "{{ live_vm_host_authority_server_ca_source }}"}
    - {name: worker-client-ca, source: "{{ live_vm_host_authority_worker_client_ca_source }}"}
    - {name: health-client-certificate, source: "{{ live_vm_host_authority_health_client_certificate_source }}"}
    - {name: health-client-key, source: "{{ live_vm_host_authority_health_client_key_source }}"}
  no_log: true
  register: live_vm_host_authority_credentials
  when: live_vm_host_authority_enabled | bool
  notify: Restart the external-boot authority service after deployed changes
