---
- name: Assert the runner host is Ubuntu/Debian (system Python 3.14 + python3-guestfs, ADR-0387)
  # The venv strategy relies on the system interpreter being Python 3.14 with a matching
  # python3-guestfs binding. Ubuntu 26.04 ships both; RHEL/Rocky ship Python 3.12 and no 3.14
  # libguestfs, so the contract cannot be met there. Fail loud rather than half-provision.
  ansible.builtin.assert:
    that: ansible_os_family == 'Debian'
    fail_msg: >-
      live_vm_host targets the Ubuntu 26.04 runner base (ADR-0387); this host is
      {{ ansible_distribution }} {{ ansible_distribution_version }}.

- name: Ensure the runner service account exists in kvm and libvirt
  ansible.builtin.user:
    name: "{{ github_runner_user }}"
    system: true
    create_home: true
    shell: /bin/bash
    groups: [kvm, libvirt]
    append: true

- name: Install the kernel-debug toolchain + venv build deps (Debian)
  ansible.builtin.apt:
    name: "{{ live_vm_host_packages }}"
    state: present
    update_cache: true

- name: "Install Docker Engine + compose plugin (the self-hosted job's on-box stack, #1293)"
  # The self-hosted live_vm gate brings up the compose backends on the box via
  # scripts/live-stack/up.sh; without a container runtime that step fails on a freshly
  # reprovisioned cattle runner. Declared here so the runner is stack-capable, not hand-installed.
  ansible.builtin.apt:
    name: "{{ live_vm_host_docker_packages }}"
    state: present
    update_cache: true

- name: Add the runner service account to the docker group
  ansible.builtin.user:
    name: "{{ github_runner_user }}"
    groups: docker
    append: true

- name: Find the host kernels under /boot (vmlinuz-* x86, vmlinux-* ppc64le)
  # Ubuntu ships /boot/vmlinuz-* 0600 root:root; libguestfs' supermin appliance
  # build (ADR-0222, #694/#1156) — probed by check-local-libvirt.sh as a FAIL — needs them
  # readable by the non-root runner user. Re-apply after a kernel upgrade (see runbook).
  ansible.builtin.find:
    paths: /boot
    patterns: ["vmlinuz-*", "vmlinux-*"]
  register: live_vm_host_boot_kernels

- name: Make the host kernels kvm-group-readable for the service account
  # 0640 root:kvm, not 0644: the runner user is in the kvm group (added above), so this is
  # genuinely group-scoped rather than world-readable — it does not fully undo the distro's
  # 0600 hardening for every local uid. file+mode reports changed only when the mode/group
  # actually changes, so a converged re-run is 0-changed (the spec's idempotence bar).
  ansible.builtin.file:
    path: "{{ item.path }}"
    group: kvm
    mode: "0640"
  loop: "{{ live_vm_host_boot_kernels.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Enable linger so /run/user/<uid> exists with no login session
  ansible.builtin.command: "loginctl enable-linger {{ github_runner_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ github_runner_user }}"

- name: Install uv system-wide (the venv builder; not in the debug toolchain)
  # The service account runs `uv sync` below; /opt is root-owned so uv must be on the
  # system PATH, not a per-user install. pip installs the console script to /usr/local/bin.
  # --break-system-packages: Ubuntu 26.04's system Python is PEP 668 externally-managed,
  # so a plain system `pip install` errors; the flag is accepted (and a no-op) on pip >= 23.
  ansible.builtin.pip:
    name: uv
    state: present
    extra_args: --break-system-packages

- name: Create the venv root owned by the service account
  # /opt is root-owned 0755, so a non-root `git` clone cannot mkdir it — create it first.
  ansible.builtin.file:
    path: "{{ live_vm_venv }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0755"

- name: Check out the project source for the venv
  ansible.builtin.git:
    repo: "{{ live_vm_repo_url }}"
    dest: "{{ live_vm_venv }}"
    version: "{{ live_vm_repo_version }}"
  become: true
  become_user: "{{ github_runner_user }}"
  register: live_vm_host_checkout

- name: Build the venv against the SYSTEM interpreter (ABI-match python3-guestfs)  # noqa: no-handler
  # noqa no-handler: not a handler on purpose — the venv must exist before the libguestfs
  # symlink task later in THIS play, but handlers run post-play (too late on first provision).
  # uv defaults to a managed CPython whose minor version may differ from the distro's
  # python3-guestfs .so; pin to /usr/bin/python3 (Ubuntu 26.04's 3.14) so the symlinked native
  # module ABI-matches.
  # Run whenever the checkout advanced (main is a moving ref), NOT `creates:`-gated — a creates
  # guard would freeze the venv's deps at first-provision while the source moved on, so a live
  # dependency added to main would never reach the venv the worker imports from. On a converged
  # host (main unchanged) the git task is unchanged, so uv sync is skipped and the run is 0-changed.
  ansible.builtin.command:
    cmd: "{{ live_vm_host_uv_bin }} sync --python /usr/bin/python3 --group live"
    chdir: "{{ live_vm_venv }}"
  become: true
  become_user: "{{ github_runner_user }}"
  when: live_vm_host_checkout is changed
  changed_when: true

- name: Locate the system libguestfs binding files
  # Debian installs python3-guestfs into the version-agnostic /usr/lib/python3/dist-packages
  # (not a per-version site-packages): guestfs.py plus libguestfsmod.cpython-<abi>.so, built for
  # Ubuntu 26.04's system Python 3.14 — the same interpreter the venv is pinned to above, so the
  # symlinked native module ABI-matches.
  ansible.builtin.find:
    paths: /usr/lib/python3/dist-packages
    patterns: ["guestfs.py", "libguestfsmod*.so"]
  register: live_vm_host_libguestfs_files

- name: Assert the libguestfs binding was found (fail loud, not an empty symlink loop)
  # Without this, a missing binding (wrong path / python3-libguestfs absent) would make the
  # symlink loop a silent no-op and only surface one task later at the check-local-libvirt gate.
  ansible.builtin.assert:
    that: live_vm_host_libguestfs_files.matched > 0
    fail_msg: >-
      guestfs.py / libguestfsmod*.so not found under /usr/lib/python3/dist-packages —
      is python3-guestfs installed (it is in live_vm_host_packages) and does the ansible
      interpreter match /usr/bin/python3 (the venv's --python)?

- name: Symlink the libguestfs binding into the venv site-packages (no PyPI wheel exists)
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: >-
      {{ live_vm_venv }}/.venv/lib/python{{ ansible_python.version.major }}.{{
      ansible_python.version.minor }}/site-packages/{{ item.path | basename }}
    state: link
    force: true
  loop: "{{ live_vm_host_libguestfs_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
  become_user: "{{ github_runner_user }}"

- name: Create the staging directories owned by the service account
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0755"
  loop: "{{ live_vm_staging_dirs }}"

- name: Ensure the /var/lib/kdive parent is world-traversable
  ansible.builtin.file:
    path: /var/lib/kdive
    state: directory
    mode: "0755"

- name: Create the fixed live-worker groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
    state: present
  loop:
    - "{{ live_vm_host_worker_control_group }}"
    - "{{ live_vm_host_worker_libvirt_group }}"

- name: Create the fixed live-worker primary groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
    state: present
  loop: "{{ live_vm_host_worker_accounts }}"

- name: Add the runner to the live-worker control and libvirt groups
  ansible.builtin.user:
    name: "{{ github_runner_user }}"
    groups:
      - "{{ live_vm_host_worker_control_group }}"
      - "{{ live_vm_host_worker_libvirt_group }}"
    append: true

- name: Create the isolated live-worker accounts
  ansible.builtin.user:
    name: "{{ item }}"
    system: true
    create_home: false
    home: /nonexistent
    shell: /usr/sbin/nologin
    group: "{{ item }}"
    groups: ["{{ live_vm_host_worker_libvirt_group }}"]
    append: false
  loop: "{{ live_vm_host_worker_accounts }}"

- name: Look up the live-worker operator account
  ansible.builtin.getent:
    database: passwd
    key: "{{ github_runner_user }}"

- name: Record the live-worker operator uid
  ansible.builtin.set_fact:
    live_vm_host_worker_operator_uid: "{{ ansible_facts.getent_passwd[github_runner_user][1] }}"

- name: Create root-owned live-worker installation and credential directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /usr/local/libexec, mode: "0755"}
    - {path: /etc/kdive, mode: "0755"}
    - {path: /etc/kdive/credentials, mode: "0700"}
    - {path: "{{ live_vm_host_worker_state_root }}", mode: "0755"}
    - {path: /opt/kdive-live-worker-lifecycle, mode: "0755"}

- name: Create the shared slots parent
  ansible.builtin.file:
    path: "{{ live_vm_host_worker_state_root }}/slots"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create root-owned fixed slot directories
  ansible.builtin.file:
    path: >-
      {{ live_vm_host_worker_state_root }}/slots/{{
      item | regex_replace('^kdive-worker-', '') }}
    state: directory
    owner: root
    group: "{{ item }}"
    mode: "0750"
  loop: "{{ live_vm_host_worker_accounts }}"

- name: Inspect the protected runtime parent without following links
  ansible.builtin.stat:
    path: /run/kdive
    follow: false
  register: live_vm_host_worker_runtime_parent_before

- name: Require a real protected runtime parent
  ansible.builtin.assert:
    that:
      - >-
        not live_vm_host_worker_runtime_parent_before.stat.exists
        or (
        live_vm_host_worker_runtime_parent_before.stat.isdir
        and not live_vm_host_worker_runtime_parent_before.stat.islnk
        )
    fail_msg: >-
      /run/kdive must be a real directory; the existing entry was left untouched. Correct it and
      rerun provisioning.

- name: Create the protected runtime parent
  ansible.builtin.file:
    path: /run/kdive
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the protected session-libvirt socket namespaces
  block:
    - name: Inspect the runtime root without following links
      ansible.builtin.stat:
        path: "{{ live_vm_host_worker_libvirt_runtime }}"
        follow: false
      register: live_vm_host_worker_runtime_root_before

    - name: Require a real session-libvirt runtime root
      ansible.builtin.assert:
        that:
          - >-
            not live_vm_host_worker_runtime_root_before.stat.exists
            or (
            live_vm_host_worker_runtime_root_before.stat.isdir
            and not live_vm_host_worker_runtime_root_before.stat.islnk
            )
        fail_msg: >-
          The session-libvirt runtime root must be a real directory; it was left untouched.

    - name: Lock the session-libvirt runtime root
      ansible.builtin.file:
        path: "{{ live_vm_host_worker_libvirt_runtime }}"
        state: directory
        owner: root
        group: "{{ live_vm_host_worker_libvirt_group }}"
        mode: "0750"

    - name: Inspect the libvirt child without following links
      ansible.builtin.stat:
        path: "{{ live_vm_host_worker_libvirt_runtime + '/libvirt' }}"
        follow: false
      register: live_vm_host_worker_runtime_child_before

    - name: Require a real libvirt runtime child
      ansible.builtin.assert:
        that:
          - >-
            not live_vm_host_worker_runtime_child_before.stat.exists
            or (
            live_vm_host_worker_runtime_child_before.stat.isdir
            and not live_vm_host_worker_runtime_child_before.stat.islnk
            )
        fail_msg: >-
          The libvirt runtime child must be a real directory; it and its target were left
          untouched.

    - name: Lock the libvirt runtime child
      ansible.builtin.file:
        path: "{{ live_vm_host_worker_libvirt_runtime + '/libvirt' }}"
        state: directory
        owner: root
        group: "{{ live_vm_host_worker_libvirt_group }}"
        mode: "0750"
  always:
    - name: Restore the initial libvirt runtime child ownership
      ansible.builtin.file:
        path: "{{ live_vm_host_worker_libvirt_runtime + '/libvirt' }}"
        state: directory
        owner: "{{ github_runner_user }}"
        group: "{{ live_vm_host_worker_libvirt_group }}"
        mode: "0750"
      when:
        - live_vm_host_worker_runtime_child_before is defined
        - >-
          not live_vm_host_worker_runtime_child_before.stat.exists
          or (
          live_vm_host_worker_runtime_child_before.stat.isdir
          and not live_vm_host_worker_runtime_child_before.stat.islnk
          )

    - name: Restore the initial session-libvirt runtime root ownership
      ansible.builtin.file:
        path: "{{ live_vm_host_worker_libvirt_runtime }}"
        state: directory
        owner: "{{ github_runner_user }}"
        group: "{{ live_vm_host_worker_libvirt_group }}"
        mode: "0750"
      when:
        - live_vm_host_worker_runtime_root_before is defined
        - >-
          not live_vm_host_worker_runtime_root_before.stat.exists
          or (
          live_vm_host_worker_runtime_root_before.stat.isdir
          and not live_vm_host_worker_runtime_root_before.stat.islnk
          )

- name: Create group-writable provider data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ live_vm_host_worker_libvirt_group }}"
    mode: "2770"
  loop: "{{ live_vm_host_worker_shared_directories }}"

- name: Create the fixed worker fixture catalog
  ansible.builtin.copy:
    src: "{{ live_vm_venv }}/fixtures/local-libvirt/"
    dest: "{{ live_vm_host_worker_fixture_catalog }}/"
    remote_src: true
    owner: root
    group: "{{ live_vm_host_worker_libvirt_group }}"
    directory_mode: "0750"
    mode: preserve

- name: Keep the fixed worker fixture catalog group-readable
  ansible.builtin.file:
    path: "{{ live_vm_host_worker_fixture_catalog }}"
    state: directory
    owner: root
    group: "{{ live_vm_host_worker_libvirt_group }}"
    mode: "u=rwX,g=rX,o="
    recurse: true

- name: Install the fixed live-worker executables
  ansible.builtin.copy:
    src: "{{ live_vm_venv }}/deploy/systemd/bin/{{ item.source }}"
    dest: "/usr/local/libexec/{{ item.destination }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - {source: kdive-live-worker-gate, destination: kdive-live-worker-gate}
    - {source: kdive-live-worker-lifecycle, destination: kdive-live-worker-lifecycle}

- name: Install the fixed live-worker units
  ansible.builtin.copy:
    src: "{{ live_vm_venv }}/deploy/systemd/system/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - kdive-live-worker@.service
    - kdive-live-worker-lifecycle.socket
    - kdive-live-worker-lifecycle@.service

- name: Install the dedicated session-libvirt configuration
  ansible.builtin.copy:
    src: "{{ live_vm_venv }}/deploy/systemd/libvirtd-live.conf"
    dest: /etc/kdive/libvirtd-live.conf
    remote_src: true
    owner: root
    group: root
    mode: "0644"

- name: Publish the selected worker libvirt URI
  ansible.builtin.copy:
    dest: /etc/kdive/live-worker-libvirt.env
    content: "KDIVE_LIBVIRT_URI={{ live_vm_host_worker_libvirt_uri }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Install the root-only lifecycle service configuration
  ansible.builtin.copy:
    dest: /etc/kdive/live-worker-lifecycle.conf
    content: |
      KDIVE_LIVE_WORKER_OPERATOR_UID={{ live_vm_host_worker_operator_uid }}
      KDIVE_LIVE_WORKER_STATE_ROOT={{ live_vm_host_worker_state_root }}
    owner: root
    group: root
    mode: "0600"

- name: Install the root-only lifecycle witness credential
  ansible.builtin.copy:
    dest: /etc/kdive/credentials/live-worker-witness.dsn
    content: "{{ live_vm_host_worker_witness_dsn }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Create the root-owned lifecycle witness venv
  ansible.builtin.command:
    cmd: >-
      {{ live_vm_host_uv_bin }} venv --python /usr/bin/python3
      /opt/kdive-live-worker-lifecycle/.venv
  args:
    creates: /opt/kdive-live-worker-lifecycle/.venv/bin/python
  register: live_vm_host_worker_witness_venv

- name: Install KDIVE into the lifecycle witness venv
  ansible.builtin.command:
    cmd: >-
      {{ live_vm_host_uv_bin }} pip install --python
      /opt/kdive-live-worker-lifecycle/.venv/bin/python /opt/kdive
  when: live_vm_host_checkout is changed or live_vm_host_worker_witness_venv is changed
  changed_when: true

- name: Keep the lifecycle witness environment root-owned
  ansible.builtin.file:
    path: /opt/kdive-live-worker-lifecycle
    state: directory
    recurse: true
    owner: root
    group: root

- name: Install the lifecycle witness source revision
  ansible.builtin.copy:
    dest: /opt/kdive-live-worker-lifecycle/revision
    content: "{{ live_vm_host_checkout.after }}\n"
    owner: root
    group: root
    mode: "0444"

- name: Inspect the selected Debian-family libvirtd executable
  ansible.builtin.stat:
    path: /usr/sbin/libvirtd
  register: live_vm_host_worker_libvirtd_executable

- name: Require the selected Debian-family libvirtd executable
  ansible.builtin.assert:
    that:
      - live_vm_host_worker_libvirtd_executable.stat.exists
      - live_vm_host_worker_libvirtd_executable.stat.isreg
      - live_vm_host_worker_libvirtd_executable.stat.executable
    fail_msg: selected Debian-family libvirtd executable is missing at /usr/sbin/libvirtd

- name: Initialize the selected libvirt startup decision
  ansible.builtin.set_fact:
    live_vm_host_worker_libvirtd_should_start: false

- name: Reconcile the selected libvirt tuple under a protected hierarchy
  block:
    - name: Lock the selected libvirt tuple hierarchy
      ansible.builtin.file:
        path: "{{ live_vm_host_worker_libvirt_runtime }}"
        state: directory
        owner: root
        group: "{{ live_vm_host_worker_libvirt_group }}"
        mode: "0750"

    - name: Reinspect the libvirt child without following links
      ansible.builtin.stat:
        path: "{{ live_vm_host_worker_libvirt_runtime + '/libvirt' }}"
        follow: false
      register: live_vm_host_worker_runtime_child_locked

    - name: Require the locked libvirt child to remain a real directory
      ansible.builtin.assert:
        that:
          - live_vm_host_worker_runtime_child_locked.stat.exists
          - live_vm_host_worker_runtime_child_locked.stat.isdir
          - not live_vm_host_worker_runtime_child_locked.stat.islnk
        fail_msg: >-
          The libvirt runtime child changed before tuple inspection; it was left untouched.

    - name: Lock the libvirt tuple child directory
      ansible.builtin.file:
        path: "{{ live_vm_host_worker_libvirt_runtime + '/libvirt' }}"
        state: directory
        owner: root
        group: "{{ live_vm_host_worker_libvirt_group }}"
        mode: "0750"

    - name: Inspect the selected libvirtd pid file
      ansible.builtin.stat:
        path: /run/kdive/live-libvirt/libvirt/libvirtd.pid
        follow: false
      register: live_vm_host_worker_libvirtd_pid_file

    - name: Inspect the selected libvirt socket residue
      ansible.builtin.stat:
        path: /run/kdive/live-libvirt/libvirt/libvirt-sock
        follow: false
      register: live_vm_host_worker_libvirt_socket_residue

    - name: Fail closed on unsafe selected libvirt residue authority
      ansible.builtin.assert:
        that:
          - >-
            not live_vm_host_worker_libvirtd_pid_file.stat.exists
            or (
            live_vm_host_worker_libvirtd_pid_file.stat.isreg
            and not live_vm_host_worker_libvirtd_pid_file.stat.islnk
            and live_vm_host_worker_libvirtd_pid_file.stat.pw_name == github_runner_user
            and live_vm_host_worker_libvirtd_pid_file.stat.mode in ['0600', '0644']
            )
          - >-
            not live_vm_host_worker_libvirt_socket_residue.stat.exists
            or (
            live_vm_host_worker_libvirt_socket_residue.stat.issock
            and not live_vm_host_worker_libvirt_socket_residue.stat.islnk
            and live_vm_host_worker_libvirt_socket_residue.stat.pw_name == github_runner_user
            and live_vm_host_worker_libvirt_socket_residue.stat.gr_name
            == live_vm_host_worker_libvirt_group
            and live_vm_host_worker_libvirt_socket_residue.stat.mode == '0770'
            )
        fail_msg: >-
          Contradictory selected libvirt residue authority; the exact pid and socket paths were
          left untouched. Inspect their type and ownership, correct the evidence, then rerun.

    - name: Read the selected libvirtd pid file
      ansible.builtin.slurp:
        path: /run/kdive/live-libvirt/libvirt/libvirtd.pid
      when: live_vm_host_worker_libvirtd_pid_file.stat.exists
      register: live_vm_host_worker_libvirtd_pid_content

    - name: Fail closed on malformed selected libvirtd pid evidence
      ansible.builtin.assert:
        that:
          - >-
            not live_vm_host_worker_libvirtd_pid_file.stat.exists
            or (live_vm_host_worker_libvirtd_pid_content.content | b64decode | trim)
            is match('^[1-9][0-9]*$')
        fail_msg: >-
          Contradictory selected libvirt pid content; the exact pid and socket paths were left
          untouched. Inspect the selected pid file, correct the evidence, then rerun.

    - name: Record the selected libvirtd pid
      ansible.builtin.set_fact:
        live_vm_host_worker_libvirtd_pid: >-
          {{ (live_vm_host_worker_libvirtd_pid_content.content | b64decode | trim)
          if live_vm_host_worker_libvirtd_pid_file.stat.exists else '' }}

    - name: Inspect the selected libvirtd pid process
      ansible.builtin.command:
        argv:
          - /usr/bin/ps
          - -o
          - uid=,comm=
          - -p
          - "{{ live_vm_host_worker_libvirtd_pid }}"
      when: live_vm_host_worker_libvirtd_pid | length > 0
      register: live_vm_host_worker_libvirtd_process
      failed_when: false
      changed_when: false

    - name: Record whether the selected libvirtd pid is live
      ansible.builtin.set_fact:
        live_vm_host_worker_libvirtd_live: >-
          {{ live_vm_host_worker_libvirtd_pid | length > 0
          and (live_vm_host_worker_libvirtd_process.rc | default(1)) == 0 }}

    - name: Probe the selected libvirt socket listener
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import socket
            import sys

            client = socket.socket(socket.AF_UNIX)
            client.settimeout(0.5)
            try:
                client.connect(sys.argv[1])
            except ConnectionRefusedError:
                raise SystemExit(3)
            except OSError:
                raise SystemExit(4)
            finally:
                client.close()
          - /run/kdive/live-libvirt/libvirt/libvirt-sock
      when: live_vm_host_worker_libvirt_socket_residue.stat.exists
      register: live_vm_host_worker_libvirt_socket_probe
      failed_when: false
      changed_when: false

    - name: Fail closed on contradictory selected libvirt evidence
      ansible.builtin.assert:
        that:
          - >-
            not live_vm_host_worker_libvirtd_live
            or live_vm_host_worker_libvirtd_process.stdout.split()
            == [live_vm_host_worker_operator_uid | string, 'libvirtd']
          - >-
            not live_vm_host_worker_libvirtd_live
            or (
            live_vm_host_worker_libvirt_socket_residue.stat.exists
            and live_vm_host_worker_libvirt_socket_probe.rc == 0
            )
          - >-
            live_vm_host_worker_libvirtd_live
            or not live_vm_host_worker_libvirt_socket_residue.stat.exists
            or live_vm_host_worker_libvirt_socket_probe.rc == 3
        fail_msg: >-
          Contradictory selected libvirt process, pid, or listener evidence; the exact pid and
          socket paths were left untouched. Inspect their owning process, correct the evidence,
          then rerun.

    - name: Refresh selected libvirt residue identity before cleanup
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /run/kdive/live-libvirt/libvirt/libvirtd.pid
        - /run/kdive/live-libvirt/libvirt/libvirt-sock
      register: live_vm_host_worker_libvirt_residue_refresh
      when: not live_vm_host_worker_libvirtd_live

    - name: Reinspect the selected libvirtd process before cleanup
      ansible.builtin.command:
        argv:
          - /usr/bin/ps
          - -o
          - uid=,comm=
          - -p
          - "{{ live_vm_host_worker_libvirtd_pid }}"
      when:
        - not live_vm_host_worker_libvirtd_live
        - live_vm_host_worker_libvirtd_pid | length > 0
      register: live_vm_host_worker_libvirtd_process_refresh
      failed_when: false
      changed_when: false

    - name: Reprobe the selected libvirt socket listener before cleanup
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import socket
            import sys

            client = socket.socket(socket.AF_UNIX)
            client.settimeout(0.5)
            try:
                client.connect(sys.argv[1])
            except ConnectionRefusedError:
                raise SystemExit(3)
            except OSError:
                raise SystemExit(4)
            finally:
                client.close()
          - /run/kdive/live-libvirt/libvirt/libvirt-sock
      when:
        - not live_vm_host_worker_libvirtd_live
        - live_vm_host_worker_libvirt_socket_residue.stat.exists
      register: live_vm_host_worker_libvirt_socket_probe_refresh
      failed_when: false
      changed_when: false

    - name: Assert selected libvirt evidence did not change under lock
      ansible.builtin.assert:
        that:
          - >-
            not live_vm_host_worker_libvirtd_pid_file.stat.exists
            or live_vm_host_worker_libvirtd_process_refresh.rc != 0
          - >-
            not live_vm_host_worker_libvirt_socket_residue.stat.exists
            or live_vm_host_worker_libvirt_socket_probe_refresh.rc == 3
          - >-
            live_vm_host_worker_libvirt_residue_refresh.results[0].stat.exists
            == live_vm_host_worker_libvirtd_pid_file.stat.exists
          - >-
            not live_vm_host_worker_libvirtd_pid_file.stat.exists
            or (
            live_vm_host_worker_libvirt_residue_refresh.results[0].stat.inode
            == live_vm_host_worker_libvirtd_pid_file.stat.inode
            and live_vm_host_worker_libvirt_residue_refresh.results[0].stat.dev
            == live_vm_host_worker_libvirtd_pid_file.stat.dev
            and live_vm_host_worker_libvirt_residue_refresh.results[0].stat.isreg
            and not live_vm_host_worker_libvirt_residue_refresh.results[0].stat.islnk
            and live_vm_host_worker_libvirt_residue_refresh.results[0].stat.pw_name
            == github_runner_user
            and live_vm_host_worker_libvirt_residue_refresh.results[0].stat.mode
            in ['0600', '0644']
            )
          - >-
            live_vm_host_worker_libvirt_residue_refresh.results[1].stat.exists
            == live_vm_host_worker_libvirt_socket_residue.stat.exists
          - >-
            not live_vm_host_worker_libvirt_socket_residue.stat.exists
            or (
            live_vm_host_worker_libvirt_residue_refresh.results[1].stat.inode
            == live_vm_host_worker_libvirt_socket_residue.stat.inode
            and live_vm_host_worker_libvirt_residue_refresh.results[1].stat.dev
            == live_vm_host_worker_libvirt_socket_residue.stat.dev
            and live_vm_host_worker_libvirt_residue_refresh.results[1].stat.issock
            and not live_vm_host_worker_libvirt_residue_refresh.results[1].stat.islnk
            and live_vm_host_worker_libvirt_residue_refresh.results[1].stat.pw_name
            == github_runner_user
            and live_vm_host_worker_libvirt_residue_refresh.results[1].stat.gr_name
            == live_vm_host_worker_libvirt_group
            and live_vm_host_worker_libvirt_residue_refresh.results[1].stat.mode == '0770'
            )
        fail_msg: >-
          Selected libvirt residue changed under the protected hierarchy; both paths were left
          untouched. Inspect the exact entries, correct the evidence, then rerun.
      when: not live_vm_host_worker_libvirtd_live

    - name: Remove proven stale selected libvirt residues
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop:
        - path: /run/kdive/live-libvirt/libvirt/libvirtd.pid
          exists: "{{ live_vm_host_worker_libvirtd_pid_file.stat.exists }}"
        - path: /run/kdive/live-libvirt/libvirt/libvirt-sock
          exists: "{{ live_vm_host_worker_libvirt_socket_residue.stat.exists }}"
      when:
        - not live_vm_host_worker_libvirtd_live
        - item.exists | bool

    - name: Verify selected libvirt stale cleanup postconditions
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /run/kdive/live-libvirt/libvirt/libvirtd.pid
        - /run/kdive/live-libvirt/libvirt/libvirt-sock
      register: live_vm_host_worker_libvirt_cleanup_postconditions
      when: not live_vm_host_worker_libvirtd_live

    - name: Require complete selected libvirt stale cleanup
      ansible.builtin.assert:
        that:
          - >-
            live_vm_host_worker_libvirt_cleanup_postconditions.results
            | map(attribute='stat.exists') | select('equalto', true) | list | length == 0
        fail_msg: >-
          Selected libvirt stale cleanup was incomplete; startup remains blocked. Inspect the exact
          pid and socket paths, correct the residue, then rerun.
      when: not live_vm_host_worker_libvirtd_live

    - name: Permit selected libvirtd startup only after complete stale cleanup
      ansible.builtin.set_fact:
        live_vm_host_worker_libvirtd_should_start: true
      when:
        - not live_vm_host_worker_libvirtd_live
        - >-
          live_vm_host_worker_libvirt_cleanup_postconditions.results
          | map(attribute='stat.exists') | select('equalto', true) | list | length == 0
  always:
    - name: Restore the session-libvirt runtime hierarchy
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ github_runner_user }}"
        group: "{{ live_vm_host_worker_libvirt_group }}"
        mode: "0750"
      loop:
        - path: "{{ live_vm_host_worker_libvirt_runtime + '/libvirt' }}"
          safe: >-
            {{ live_vm_host_worker_runtime_child_locked is defined
            and live_vm_host_worker_runtime_child_locked.stat.exists
            and live_vm_host_worker_runtime_child_locked.stat.isdir
            and not live_vm_host_worker_runtime_child_locked.stat.islnk }}
        - path: "{{ live_vm_host_worker_libvirt_runtime }}"
          safe: true
      when: item.safe | bool

- name: Start the operator-owned dedicated session libvirtd
  ansible.builtin.command:
    cmd: >-
      /usr/sbin/libvirtd --daemon --config /etc/kdive/libvirtd-live.conf
      --pid-file /run/kdive/live-libvirt/libvirt/libvirtd.pid
  environment:
    XDG_RUNTIME_DIR: /run/kdive/live-libvirt
  become: true
  become_user: "{{ github_runner_user }}"
  when: live_vm_host_worker_libvirtd_should_start
  changed_when: true

- name: Enable the live-worker lifecycle control socket
  ansible.builtin.systemd_service:
    name: kdive-live-worker-lifecycle.socket
    daemon_reload: true
    enabled: true
    state: started

# No static disk labeling on the Ubuntu target: libvirt confines qemu with AppArmor, and
# virt-aa-helper adds each domain's disk paths to its per-domain profile dynamically from the
# domain XML. The world-traversable, runner-owned staging dirs above therefore need no static
# sVirt label (the SELinux virt_image_t equivalent RHEL required).

- name: Run the host-contract gate
  ansible.builtin.import_tasks: verify.yml
