---
# The remote-libvirt `live_vm` family (#1424, ADR-0425, `just test-live-remote`) needs NO
# additional host package here: it connects OUT to a remote qemu+tls:// host over the libvirt TLS
# client stack (`libvirt-clients` + `gnutls-bin`) the `libvirt_stack` role already declares, and
# its introspect leg reuses the worker-side vmcore postmortem (`drgn`, built into the venv
# with the development headers in local_worker_host). The reconciler it depends on is a kdive
# host process, not a system package. This nil delta is recorded so the "declare host deps in the
# same change" discipline (AGENTS.md) is auditable rather than silent — add packages here if a
# remote proof ever grows a genuine host-tool need.

# Container runtime for the #1293 self-hosted job's on-box compose stack (scripts/live-stack/up.sh).
# docker-compose-v2 provides `docker compose` (the plugin) on Ubuntu 26.04.
live_vm_host_docker_packages:
  - docker.io
  - docker-compose-v2

# pip installs the uv console script to /usr/local/bin. Reference uv by absolute path in the
# venv-build command so it is found under become regardless of sudo's PATH handling; override
# if pip is configured to install console scripts elsewhere.
live_vm_host_uv_bin: /usr/local/bin/uv

live_vm_host_worker_libvirt_runtime: /run/kdive/live-libvirt
live_vm_host_worker_libvirt_uri: >-
  qemu+unix:///session?socket=/run/kdive/live-libvirt/libvirt/libvirt-sock
# Local development default only; production inventory must override it with the bootstrapped
# lifecycle-witness member DSN. Provisioning keeps the resulting file root-only.
live_vm_host_worker_witness_dsn: >-  # pragma: allowlist secret
  postgresql://kdive-witness-member:kdive-witness-local@localhost:5432/kdive
live_vm_host_worker_fixture_catalog: /var/lib/kdive/fixtures/local-libvirt
live_vm_host_worker_fixture_files:
  - manifest.yaml
  - rootfs_catalog.toml
  - profiles/console-ready_ppc64le.yaml
  - profiles/console-ready_x86_64.yaml

# Dormant provider-host authority boundary (ADR-0584). This endpoint is separate from the
# fixed-worker provider contract above; #2140 owns any later adapter binding or worker cutover.
live_vm_host_authority_enabled: false
live_vm_host_authority_account: kdive-provider-authority
live_vm_host_authority_runtime_root: /run/kdive/provider-authority
live_vm_host_authority_runtime_install: /opt/kdive-provider-authority
live_vm_host_authority_credentials_dir: /etc/kdive/credentials/provider-authority
live_vm_host_authority_environment: /etc/kdive/provider-authority.env
live_vm_host_authority_instance: "{{ inventory_hostname }}"
live_vm_host_authority_database_login: kdive_authority_host
live_vm_host_authority_database_name: kdive
live_vm_host_authority_database_dsn_source: ""
live_vm_host_authority_server_key_source: ""
live_vm_host_authority_server_certificate_source: ""
live_vm_host_authority_server_ca_source: ""
live_vm_host_authority_worker_client_ca_source: ""
live_vm_host_authority_health_client_certificate_source: ""
live_vm_host_authority_health_client_key_source: ""
# Identity-only remains the default. Mutation mode is for Systems whose domain, overlay, and
# console were provisioned under this authority identity on its private daemon.
live_vm_host_authority_local_mutation_enabled: false
live_vm_host_authority_recovery_root: /var/lib/kdive/provider-authority/recovery
live_vm_host_authority_rootfs_root: /var/lib/kdive/provider-authority/rootfs
live_vm_host_authority_console_root: /var/lib/kdive/provider-authority/console
live_vm_host_authority_external_boot_capacity_bytes: null
live_vm_host_authority_s3_endpoint_url: ""
live_vm_host_authority_s3_bucket: ""
live_vm_host_authority_s3_region: us-east-1
live_vm_host_authority_s3_credentials_source: ""
# Authority-owned local Systems are an explicit operator installation. Each base entry maps a
# controller ``source`` to one 64-hex ``digest`` filename beneath the private base root.
live_vm_host_authority_system_manifest_source: ""
live_vm_host_authority_system_local_bases: []
live_vm_host_worker_authority_instance: "{{ live_vm_host_authority_instance }}"
live_vm_host_worker_authority_request_socket: /run/kdive/provider-authority/request/authority.sock
live_vm_host_worker_authority_server_ca_source: "{{ live_vm_host_authority_server_ca_source }}"
live_vm_host_worker_authority_client_certificate_source: ""
live_vm_host_worker_authority_client_key_source: ""
live_vm_host_worker_authority_secrets_root: /var/lib/kdive/secrets/external-boot-authority
live_vm_host_worker_authority_server_ca_ref: external-boot-authority/server-ca
live_vm_host_worker_authority_client_certificate_ref: external-boot-authority/client-certificate
live_vm_host_worker_authority_client_key_ref: external-boot-authority/client-key  # pragma: allowlist secret
live_vm_host_authority_proof_enabled: false
live_vm_host_authority_fault_proof_enabled: false
live_vm_host_authority_proof_account: kdive-authority-2150-proof
live_vm_host_authority_proof_incarnation: kdive-authority-2150-proof
live_vm_host_authority_proof_client_certificate: ""
live_vm_host_authority_proof_client_key: ""
live_vm_host_authority_proof_worker_credential: ""
live_vm_host_authority_proof_request: ""
live_vm_host_authority_database_admin_dsn: ""
live_vm_host_authority_packages:
  - acl
  - openssl
  - postgresql
  - python3-psycopg
live_vm_host_authority_libvirt_uri: >-
  qemu+unix:///session?socket=/run/kdive/provider-authority/libvirt/libvirt-sock
live_vm_host_authority_denied_paths:
  - /opt/kdive-provider-authority
  - /etc/kdive/credentials/provider-authority
  - /var/lib/kdive/provider-authority
  - /var/lib/kdive/provider-authority/journal
  - /run/kdive/provider-authority
  - /run/kdive/provider-authority/request
  - /run/kdive/provider-authority/libvirt
