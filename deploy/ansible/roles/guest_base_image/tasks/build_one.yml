---
# Build and stage one catalog image. Included per-image from main.yml with
# loop_var `image`. Per-image effective fields fall back to kdive_image_defaults.
# Idempotent: skips the build/customize/stage steps when the staged volume is
# already present, unless force_image_rebuild or the per-entry `force` is set.
- name: Resolve effective image fields for {{ image.name }}
  ansible.builtin.set_fact:
    guest_base_image_packages: >-
      {{ (image.packages | default(kdive_image_defaults.packages))
         + (['kernel-debuginfo']
            if (image.include_kernel_debuginfo
                | default(kdive_image_defaults.include_kernel_debuginfo)) | bool
            else []) }}
    guest_base_image_helpers: "{{ image.helpers | default(kdive_image_defaults.helpers) }}"
    guest_base_image_fadump_capture: >-
      {{ image.fadump_capture | default(kdive_image_defaults.fadump_capture) }}
    guest_base_image_kdump_service: >-
      {{ image.kdump_service | default(kdive_image_defaults.kdump_service) }}
    guest_base_image_crashkernel: >-
      {{ image.crashkernel | default(kdive_image_defaults.crashkernel) }}
    guest_base_image_debuginfo: >-
      {{ image.include_kernel_debuginfo
         | default(kdive_image_defaults.include_kernel_debuginfo) }}
    guest_base_image_force: >-
      {{ (force_image_rebuild | bool) or (image.force | default(false) | bool) }}
    guest_base_image_qcow2: "{{ guest_base_image_build_workdir }}/{{ image.name }}.qcow2"
    guest_base_image_helper_args: []

- name: Check whether the staged volume already exists for {{ image.name }}
  ansible.builtin.stat:
    path: "{{ storage_pool_target }}/{{ image.name }}.qcow2"
  register: guest_base_image_staged

# --- Build path A: virt-builder (native on the host). ---
- name: Build with virt-builder (native) for {{ image.name }}
  ansible.builtin.command:  # noqa: command-instead-of-module
    # No Ansible module wraps virt-builder; the command module is the only option.
    argv:
      - virt-builder
      - "{{ image.distro }}-{{ image.version }}"
      - --arch
      - "{{ ansible_architecture }}"
      - --format
      - qcow2
      - --size
      - 10G
      - --output
      - "{{ guest_base_image_qcow2 }}"
      - --install
      - "{{ guest_base_image_packages | join(',') }}"
      - --run-command
      - systemctl enable qemu-guest-agent.service
      - --run-command
      - systemctl enable {{ guest_base_image_kdump_service }}
  when:
    - image.source == 'virt-builder'
    - (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool
  changed_when: true

# --- Build path B: cloud-image (download + virt-customize). ---
- name: Download the cloud image for {{ image.name }}
  ansible.builtin.get_url:
    url: "{{ image.cloud_image_url }}"
    checksum: "{{ image.cloud_image_checksum | default(omit) }}"
    dest: >-
      {{ guest_base_image_qcow2 ~ '.source'
         if image.name == 'opensuse-leap-15.6-kdive-remote-base'
         else guest_base_image_qcow2 }}
    mode: "{{ '0444' if image.name == 'opensuse-leap-15.6-kdive-remote-base' else '0644' }}"
  when:
    - image.source == 'cloud-image'
    - (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool

- name: Grow the pinned Leap root into a fresh bounded image
  ansible.builtin.command: # noqa: command-instead-of-module
    # Native offline expansion has no Ansible module; checks gate promotion.
    argv:
      - python3
      - -c
      - |
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import shutil
        import stat
        import subprocess
        import sys

        source, destination = map(Path, sys.argv[1:])
        output = Path(str(destination) + '.growing')
        expected = '0a5720416d423f98aacaa793a57d56ec045e3dd25cd88713952660ad00da53bd'


        def require(condition, message):
            if not condition:
                raise ValueError('kdive Leap growth: ' + message)


        def run(*args):
            return subprocess.check_output(args, universal_newlines=True)


        def digest(path):
            value = hashlib.sha256()
            with path.open('rb') as stream:
                for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                    value.update(chunk)
            return value.hexdigest()


        def info(path):
            value = json.loads(run('qemu-img', 'info', '--output=json', str(path)))
            require(value['format'] == 'qcow2' and not value.get('backing-filename'),
                    'expected standalone qcow2')
            return value['virtual-size']


        def snapshot(path):
            text = run('guestfish', '--ro', '-a', str(path), 'run', ':', 'part-list', '/dev/sda',
                       ':', 'echo', 'KDIVE_METADATA', ':', 'part-get-parttype', '/dev/sda',
                       ':', 'vfs-type', '/dev/sda2', ':', 'vfs-type', '/dev/sda3',
                       ':', 'vfs-uuid', '/dev/sda3', ':', 'part-get-gpt-guid', '/dev/sda', '3',
                       ':', 'checksum-device', 'sha256', '/dev/sda1',
                       ':', 'checksum-device', 'sha256', '/dev/sda2', ':', 'echo', 'KDIVE_SPACE',
                       ':', 'mount-ro', '/dev/sda3', '/', ':', 'statvfs', '/')
            parts, rest = text.split('KDIVE_METADATA\n')
            metadata, space = rest.split('KDIVE_SPACE\n')
            values = [int(v) for v in re.findall(r'part_(?:num|start|end|size): (\d+)', parts)]
            identities = metadata.splitlines()
            require(len(values) == 12 and len(identities) == 7, 'unexpected partition metadata')
            require(identities[:3] == ['gpt', 'vfat', 'xfs'] and all(identities),
                    'expected pinned GPT/EFI/XFS identity')
            sizes = dict(re.findall(r'^(bsize|bavail): (\d+)$', space, re.M))
            return values, identities, int(sizes['bsize']) * int(sizes['bavail'])


        require(source.parent == destination.parent and source != destination,
                'source/output must be distinct in one owned work directory')
        require(source.parent.resolve() == source.parent and source.parent.stat().st_uid == os.geteuid()
                and not source.parent.stat().st_mode & 0o022, 'untrusted work directory')
        require(not source.is_symlink() and stat.S_ISREG(source.stat().st_mode)
                and source.stat().st_uid == os.geteuid(), 'source must be owned regular non-symlink')
        require(not os.path.lexists(destination) and not os.path.lexists(output),
                'output exists; preserve evidence and select a fresh work directory')
        require(digest(source) == expected, 'source checksum mismatch')
        require(shutil.disk_usage(source.parent).free >= 12 * 1024**3, 'need 12 GiB free host space')
        require('xfs' in run('virt-resize', '--machine-readable').splitlines(),
                'native virt-resize lacks XFS expansion capability')
        require(info(source) == 879755264, 'unexpected source virtual size')
        before, identity, _ = snapshot(source)
        require(before == [1,1048576,3145727,2097152,2,3145728,37748735,34603008,
                           3,37748736,879738367,841989632], 'unexpected pinned partition layout')
        source.chmod(0o444)
        subprocess.check_call(['qemu-img', 'create', '-f', 'qcow2', str(output), '10G'])
        subprocess.check_call(['virt-resize', '--format', 'qcow2', '--output-format', 'qcow2',
                               '--align-first', 'never', '--expand', '/dev/sda3',
                               '--unknown-filesystems', 'error', str(source), str(output)])
        require(digest(source) == expected, 'source changed during expansion')
        require(info(output) == 10737418240, 'unexpected output virtual size')
        after, new_identity, free = snapshot(output)
        require(after[:10] == before[:10] and after[10] > before[10]
                and after[11] == after[10] - after[9] + 1, 'partition preservation/expansion failed')
        require(new_identity == identity, 'boot contents or root identity changed')
        require(free >= 8 * 1024**3, 'expanded root needs 8 GiB free before package refresh')
        require(not os.path.lexists(destination), 'customization destination appeared')
        output.rename(destination)
        print(json.dumps({'source_sha256': expected, 'output_sha256': digest(destination),
                          'before': before, 'after': after, 'identity': identity, 'root_free_bytes': free}))
      - "{{ guest_base_image_qcow2 }}.source"
      - "{{ guest_base_image_qcow2 }}"
  when:
    - image.name == 'opensuse-leap-15.6-kdive-remote-base'
    - image.source == 'cloud-image'
    - (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool
  changed_when: true

- name: Customize the cloud image (packages + services) for {{ image.name }}
  ansible.builtin.command:  # noqa: command-instead-of-module
    # No Ansible module wraps virt-customize; the command module is the only option.
    # --install runs the IMAGE's own package manager, so the package set must use the
    # image distro's names (the ubuntu entry carries Debian names).
    argv:
      - virt-customize
      - -a
      - "{{ guest_base_image_qcow2 }}"
      - --install
      - "{{ guest_base_image_packages | join(',') }}"
      - --run-command
      - systemctl enable qemu-guest-agent.service
      - --run-command
      - systemctl enable {{ guest_base_image_kdump_service }}
  when:
    - image.source == 'cloud-image'
    - (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool
  changed_when: true

# --- Build path C: scratch (bare, from the host OS family). ---
- name: Build from scratch (bare, host OS family) for {{ image.name }}
  ansible.builtin.include_tasks: build_scratch.yml
  when:
    - image.source == 'scratch'
    - (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool

# --- Make an injected NMI actually panic the guest. ---
# control.force_crash panics the guest with virDomainInjectNMI, which relies on the guest
# panicking on an UNKNOWN NMI. Fedora/RHEL ship kernel.unknown_nmi_panic=0, so the guest
# silently ignores the NMI: it never panics, kdump never runs, and the capture phase fails as
# readiness_failure / "no kdump core in the guest's dump storage" while the domain sits happily
# `running`. A crash-test base image has to opt in explicitly.
- name: Panic on an unknown NMI for {{ image.name }}
  ansible.builtin.command: # noqa: command-instead-of-module
    # No Ansible module wraps virt-customize; the command module is the only option.
    argv:
      - virt-customize
      - -a
      - "{{ guest_base_image_qcow2 }}"
      - --run-command
      - >-
        printf 'kernel.unknown_nmi_panic = 1\nkernel.panic_on_unrecovered_nmi = 1\n'
        > /etc/sysctl.d/99-kdive-nmi-panic.conf
  when: (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool
  changed_when: true

# --- Relax SELinux so the guest-agent-spawned helpers can work. ---
# kdive drives the guest through guest-exec, so the helpers inherit the confined
# ``virt_qemu_ga_t`` domain, which denies outbound connect(). kdive-install-kernel fetches the
# kernel from a presigned object-store URL, so under enforcing SELinux every remote install
# fails as `install_failure` with the helper seeing EACCES on connect (the domain is confined
# enough that even security_getenforce() is denied, so the cause is not self-evident in-guest).
# The connect() denial is not the only one: virt_qemu_ga_t also cannot read /lib/modules, and the
# install helper's depmod/dracut/grubby children transition to further domains, so relaxing that
# one domain would not be enough. This ran ONLY in the virt-builder branch before, so cloud-image
# builds (rocky, ubuntu) stayed enforcing and could never complete an install. Applied to every
# build path, once, here; the [ -f /etc/selinux/config ] guard no-ops on AppArmor (debian) images.
# Permissive is an ACCEPTED posture, not a pending workaround — rationale, the security cost, and
# the conditions for reversing it are in docs/adr/0484-guest-images-ship-selinux-permissive.md.
- name: Relax SELinux to permissive for {{ image.name }}
  ansible.builtin.command: # noqa: command-instead-of-module
    # No Ansible module wraps virt-customize; the command module is the only option.
    argv:
      - virt-customize
      - -a
      - "{{ guest_base_image_qcow2 }}"
      - --run-command
      - >-
        if [ -f /etc/selinux/config ]; then sed -i
        's/^SELINUX=enforcing/SELINUX=permissive/' /etc/selinux/config; fi
  when: (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool
  changed_when: true

# --- Unblock the guest-agent RPCs the remote provider drives the guest with. ---
# RHEL-family images ship /etc/sysconfig/qemu-ga with an ALLOWLIST (FILTER_RPC_ARGS
# --allow-rpcs=...) that omits guest-exec. runs.install and the artifact channel spawn
# in-guest commands over guest-exec/guest-exec-status, so without this every remote
# install fails as `transport_failure`: "Command guest-exec has been disabled". Only the
# two RPCs kdive actually calls are added (guest-ping is already allowed) — the filter
# stays on. Debian-family images ship no such file, so the guard makes this a no-op there.
#
# The guard matches guest-exec as a whole comma-delimited element, NOT as a substring: a
# plain `grep 'allow-rpcs=.*guest-exec'` is satisfied by guest-exec-STATUS, so an allowlist
# carrying only guest-exec-status was skipped and left guest-exec blocked — the same opaque
# "Command guest-exec has been disabled" this task exists to prevent. Delimiters make it
# exact, and re-running is a no-op once both RPCs are present.
#
# Known gap: an image using a `--block-rpcs=` DENYLIST instead is left alone, so guest-exec
# stays blocked there. No RHEL-family image ships that shape; it fails closed, not open.
- name: Allow the guest-exec RPCs kdive requires for {{ image.name }}
  ansible.builtin.command: # noqa: command-instead-of-module
    # No Ansible module wraps virt-customize; the command module is the only option.
    argv:
      - virt-customize
      - -a
      - "{{ guest_base_image_qcow2 }}"
      - --run-command
      - >-
        if [ -f /etc/sysconfig/qemu-ga ] && ! grep -qE
        'allow-rpcs=([^"]*,)?guest-exec([,"]|$)' /etc/sysconfig/qemu-ga; then sed -i
        's/--allow-rpcs=/--allow-rpcs=guest-exec,guest-exec-status,/'
        /etc/sysconfig/qemu-ga; fi
  when: (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool
  changed_when: true

# --- Install the fadump capture service when the image is fadump-capable. ---
# kdump.service cannot rebuild the fadump initrd in the kdive-supplied initrd environment.
# The fadump-capture unit supersedes it on the capture-kernel boot
# (ConditionPathExists=/proc/vmcore), invokes makedumpfile, and powers off.
# Declared per AGENTS.md provisioning-parity rule (#2381, proved in #2312).
#
# The source is the staged copy under guest_base_image_helper_dir, not role_path: virt-customize
# resolves --upload on the host it runs on (the remote), and role_path is a control-node path
# that does not exist there. main.yml already stages helper_src -- which holds the one
# authoritative fadump-capture.service -- onto every remote build host for exactly this reason.
# That staging copies 0755; a systemd unit is 0644, so the mode is set in-guest after upload.
- name: Upload and enable the fadump capture service for {{ image.name }}
  ansible.builtin.command:  # noqa: command-instead-of-module
    # No Ansible module wraps virt-customize; the command module is the only option.
    argv:
      - virt-customize
      - -a
      - "{{ guest_base_image_qcow2 }}"
      - --upload
      - "{{ guest_base_image_helper_dir }}/fadump-capture.service:/etc/systemd/system/fadump-capture.service"
      - --run-command
      - chmod 0644 /etc/systemd/system/fadump-capture.service
      - --run-command
      - systemctl enable fadump-capture.service
  when:
    - guest_base_image_fadump_capture | bool
    - (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool
  changed_when: true

# --- Install the SSH-forward return route (ADR-0721). ---
# The remote SSH forward (ADR-0291) is a slirp NIC beside the libvirt NIC. A connection forwarded
# from a routable worker keeps the worker's source address, so without a source route the guest
# replies through its default route on the libvirt NIC and the forward never answers. The
# NetworkManager dispatcher script adds that route on every activation. An image without
# NetworkManager has no dispatcher directory and is skipped; Ubuntu uses the native policy below.
# Like the fadump unit, the source is the staged copy. It is uploaded to /tmp because --upload
# cannot target a directory the image may not have.
- name: Install the SSH-forward return-route dispatcher for {{ image.name }}
  ansible.builtin.command:  # noqa: command-instead-of-module
    # No Ansible module wraps virt-customize; the command module is the only option.
    argv:
      - virt-customize
      - -a
      - "{{ guest_base_image_qcow2 }}"
      - --upload
      - "{{ guest_base_image_helper_dir }}/kdive-ssh-return-route:/tmp/kdive-ssh-return-route"
      - --run-command
      - >-
        set -e; src=/tmp/kdive-ssh-return-route;
        dst=/etc/NetworkManager/dispatcher.d/50-kdive-ssh-return-route;
        if [ -d /etc/NetworkManager/dispatcher.d ]; then
        install -o root -g root -m 0755 "$src" "$dst";
        if command -v restorecon >/dev/null 2>&1; then restorecon -v "$dst"; fi; fi;
        rm -f "$src"
  when: (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool
  changed_when: true

# Ubuntu uses native lease events; the shared NetworkManager helper remains unchanged.
- name: Install the Ubuntu native network policy for {{ image.name }}
  ansible.builtin.command:  # noqa: command-instead-of-module
    argv:
      - virt-customize
      - -a
      - "{{ guest_base_image_qcow2 }}"
      - --upload
      - "{{ guest_base_image_helper_dir }}/kdive-ssh-return-route:/tmp/kdive-ssh-return-route"
      - --upload
      - "{{ guest_base_image_helper_dir }}/kdive-networkd-ssh-return-route:/tmp/kdive-networkd-ssh-return-route"
      - --upload
      - "{{ guest_base_image_helper_dir }}/kdive-ubuntu-network.yaml:/tmp/kdive-ubuntu-network.yaml"
      - --upload
      - "{{ guest_base_image_helper_dir }}/kdive-networkd-startup.conf:/tmp/kdive-networkd-startup.conf"
      - --upload
      - "{{ guest_base_image_helper_dir }}/kdive-ubuntu-ssh-host-keys.conf:/tmp/kdive-ubuntu-ssh-host-keys.conf"
      - --run-command
      - |
        set -eu
        command -v netplan
        command -v ip
        test -x /usr/bin/networkd-dispatcher
        for policy in /etc/netplan/*.yaml /etc/netplan/*.yml; do
          if [ -e "$policy" ] || [ -L "$policy" ]; then
            if [ "$policy" != /etc/netplan/60-kdive.yaml ] || [ -L "$policy" ] ||
                ! cmp -s "$policy" /tmp/kdive-ubuntu-network.yaml; then
              echo 'kdive: foreign netplan policy; rebuild from a clean supported Ubuntu image' >&2
              exit 1
            fi
          fi
        done
        command -v ssh-keygen
        if [ -e /etc/systemd/system/ssh.service ] || [ -L /etc/systemd/system/ssh.service ] ||
            ! awk '
              /^[[:space:]]*ExecStartPre[[:space:]]*=/ {
                count++
                if ($0 != "ExecStartPre=/usr/sbin/sshd -t") bad = 1
              }
              END { exit bad || count != 1 }
            ' /usr/lib/systemd/system/ssh.service; then
          echo 'kdive: unfamiliar Ubuntu SSH prechecks; rebuild from a clean supported image' >&2
          exit 1
        fi
        for unit_root in /etc/systemd/system /run/systemd/system /usr/lib/systemd/system; do
          for dropin in "$unit_root"/ssh.service.d/*.conf "$unit_root"/sshd.service.d/*.conf "$unit_root"/service.d/*.conf; do
            if [ -e "$dropin" ] || [ -L "$dropin" ]; then
              if [ "$dropin" != /etc/systemd/system/ssh.service.d/50-kdive-host-keys.conf ] || [ -L "$dropin" ] ||
                  ! cmp -s "$dropin" /tmp/kdive-ubuntu-ssh-host-keys.conf; then
                echo 'kdive: foreign Ubuntu SSH drop-in; rebuild from a clean supported image' >&2
                exit 1
              fi
            fi
          done
        done
        install -d -o root -g root -m 0755 /etc/systemd/system/ssh.service.d
        install -o root -g root -m 0644 /tmp/kdive-ubuntu-ssh-host-keys.conf /etc/systemd/system/ssh.service.d/50-kdive-host-keys.conf
        install -d -o root -g root -m 0755 /etc/netplan /usr/local/libexec
        install -o root -g root -m 0600 /tmp/kdive-ubuntu-network.yaml /etc/netplan/60-kdive.yaml
        install -o root -g root -m 0755 /tmp/kdive-ssh-return-route /usr/local/libexec/kdive-ssh-return-route
        install -o root -g root -m 0755 /tmp/kdive-networkd-ssh-return-route /usr/local/libexec/kdive-networkd-ssh-return-route
        for state in configured routable off no-carrier failed linger; do
          install -d -o root -g root -m 0755 "/etc/networkd-dispatcher/$state.d"
          ln -sf /usr/local/libexec/kdive-networkd-ssh-return-route "/etc/networkd-dispatcher/$state.d/50-kdive-ssh-return-route"
        done
        install -d -o root -g root -m 0755 /etc/cloud/cloud.cfg.d /etc/systemd/system/networkd-dispatcher.service.d
        printf 'network: {config: disabled}\n' > /etc/cloud/cloud.cfg.d/99-kdive-network-policy.cfg
        chmod 0644 /etc/cloud/cloud.cfg.d/99-kdive-network-policy.cfg
        install -o root -g root -m 0644 /tmp/kdive-networkd-startup.conf /etc/systemd/system/networkd-dispatcher.service.d/50-kdive-startup.conf
        netplan generate
        systemctl enable systemd-networkd.service networkd-dispatcher.service
        rm -f /tmp/kdive-ssh-return-route /tmp/kdive-networkd-ssh-return-route /tmp/kdive-ubuntu-network.yaml \
          /tmp/kdive-networkd-startup.conf /tmp/kdive-ubuntu-ssh-host-keys.conf
  when:
    - image.distro == 'ubuntu'
    - (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool
  changed_when: true

# Leap retains native Wicked/netconfig; no NetworkManager or Ubuntu policy migration.
- name: Install the Leap native network policy for {{ image.name }}
  ansible.builtin.command:  # noqa: command-instead-of-module
    argv:
      - virt-customize
      - -a
      - "{{ guest_base_image_qcow2 }}"
      - --upload
      - "{{ guest_base_image_helper_dir }}/kdive-ssh-return-route:/tmp/kdive-ssh-return-route"
      - --upload
      - "{{ guest_base_image_helper_dir }}/kdive-wicked-ssh-return-route:/tmp/kdive-wicked-ssh-return-route"
      - --upload
      - "{{ guest_base_image_helper_dir }}/kdive-wicked-policy.xml:/tmp/kdive-wicked-policy.xml"
      - --upload
      - "{{ guest_base_image_helper_dir }}/kdive-wicked-server-local.xml:/tmp/kdive-wicked-server-local.xml"
      - --upload
      - "{{ guest_base_image_helper_dir }}/kdive-wicked-startup.conf:/tmp/kdive-wicked-startup.conf"
      - --run-command
      - |
        set -eu
        command -v wicked
        command -v busctl
        command -v ip
        command -v python3
        test -x /etc/wicked/extensions/netconfig
        # These pinned native readers define source precedence and generic updater semantics.
        sha256sum -c - <<'NATIVE'
        29787e471d8f011e1e4148b897fe4a4dbaa7d98d40949e533b6d29968cd919a4  /etc/wicked/client.xml
        8bbb7040755dabbf185bea2b19587bc84cc5e6a4c3d9e3919664bd29d3010800  /etc/wicked/common.xml
        6cabde2f9efeb4a4a1a2ad6a427654c143bcb0e5afe5b64dfec30b80d54816cc  /etc/wicked/nanny.xml
        f21672f780bef41db5521962ff73486b88c69785e629ce9972abf58f0777a479  /etc/wicked/server.xml
        NATIVE
        for policy in /etc/sysconfig/network/ifcfg-* /etc/sysconfig/network/ifroute-* \
            /etc/wicked/ifconfig/* /run/wicked/nanny/policy*.xml /var/lib/wicked/nanny/policy*.xml \
            /etc/wicked/*-local.xml /etc/wicked/local.xml /etc/wicked/client-firmware.xml \
            /etc/wicked/client-nbft.xml; do
          [ -e "$policy" ] || [ -L "$policy" ] || continue
          case "$policy" in
            /etc/sysconfig/network/ifcfg-lo|/etc/sysconfig/network/ifcfg.template) continue ;;
            /etc/wicked/server-local.xml)
              if [ ! -L "$policy" ] && cmp -s "$policy" /tmp/kdive-wicked-server-local.xml; then continue; fi ;;
          esac
          echo 'kdive: foreign Wicked policy; rebuild from a clean supported Leap image' >&2
          exit 1
        done
        for unit_root in /etc/systemd/system.control /run/systemd/system.control \
            /run/systemd/transient /run/systemd/generator.early /etc/systemd/system \
            /etc/systemd/system.attached /run/systemd/system /run/systemd/system.attached \
            /run/systemd/generator /usr/local/lib/systemd/system /usr/lib/systemd/system \
            /lib/systemd/system /run/systemd/generator.late; do
          for dropin in "$unit_root"/wickedd*.service.d/*.conf "$unit_root"/wicked.service.d/*.conf \
              "$unit_root"/service.d/*.conf; do
            [ -e "$dropin" ] || [ -L "$dropin" ] || continue
            if [ "$dropin" != /etc/systemd/system/wickedd-nanny.service.d/50-kdive-startup.conf ] || \
                [ -L "$dropin" ] || ! cmp -s "$dropin" /tmp/kdive-wicked-startup.conf; then
              echo 'kdive: foreign Wicked service drop-in; rebuild from a clean supported Leap image' >&2
              exit 1
            fi
          done
          [ "$unit_root" != /usr/lib/systemd/system ] || continue
          for unit in "$unit_root"/wickedd*.service "$unit_root"/wicked.service; do
            if [ -e "$unit" ] || [ -L "$unit" ]; then
              echo 'kdive: foreign Wicked service override; rebuild from a clean supported Leap image' >&2
              exit 1
            fi
          done
        done
        for pair in kdive-wicked-policy.xml:/etc/wicked/kdive-ethernet-policy.xml \
            kdive-wicked-ssh-return-route:/usr/local/libexec/kdive-wicked/netconfig \
            kdive-wicked-startup.conf:/etc/systemd/system/wickedd-nanny.service.d/50-kdive-startup.conf; do
          src=/tmp/${pair%%:*}; dst=${pair#*:}
          if { [ -e "$dst" ] || [ -L "$dst" ]; } && \
              { [ -L "$dst" ] || ! cmp -s "$src" "$dst"; }; then
            echo 'kdive: foreign owned-path contents; rebuild from a clean supported Leap image' >&2
            exit 1
          fi
        done
        install -d -o root -g root -m 0755 /usr/local/libexec/kdive-wicked \
          /etc/systemd/system/wickedd-nanny.service.d /etc/cloud/cloud.cfg.d
        install -o root -g root -m 0755 /tmp/kdive-ssh-return-route /usr/local/libexec/kdive-ssh-return-route
        install -o root -g root -m 0755 /tmp/kdive-wicked-ssh-return-route /usr/local/libexec/kdive-wicked/netconfig
        install -o root -g root -m 0644 /tmp/kdive-wicked-policy.xml /etc/wicked/kdive-ethernet-policy.xml
        install -o root -g root -m 0644 /tmp/kdive-wicked-server-local.xml /etc/wicked/server-local.xml
        install -o root -g root -m 0644 /tmp/kdive-wicked-startup.conf /etc/systemd/system/wickedd-nanny.service.d/50-kdive-startup.conf
        printf 'network: {config: disabled}\n' > /etc/cloud/cloud.cfg.d/99-kdive-network-policy.cfg
        chmod 0644 /etc/cloud/cloud.cfg.d/99-kdive-network-policy.cfg
        systemctl enable wicked.service
        rm -f /tmp/kdive-ssh-return-route /tmp/kdive-wicked-ssh-return-route \
          /tmp/kdive-wicked-policy.xml /tmp/kdive-wicked-server-local.xml /tmp/kdive-wicked-startup.conf
  when:
    - image.distro == 'opensuse-leap'
    - (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool
  changed_when: true

# --- Set the crashkernel reservation when a debuginfo/kdump image is requested. ---
- name: Set the crashkernel reservation for {{ image.name }}
  ansible.builtin.command:  # noqa: command-instead-of-module
    # No Ansible module wraps virt-customize; the command module is the only option.
    argv:
      - virt-customize
      - -a
      - "{{ guest_base_image_qcow2 }}"
      - --run-command
      - "grubby --update-kernel=ALL --args=crashkernel={{ guest_base_image_crashkernel }}"
  when:
    - guest_base_image_debuginfo | bool
    - (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool
  changed_when: true

# --- Install the in-guest helpers: chown root:root + optional restorecon per helper
# --- (ENOENT-not-EACCES gotcha -- chmod alone does not fix it). Build the argv
# --- list with a fact loop, then run virt-customize once. ---
#
# The helpers and the worker are SEPARATELY VERSIONED artifacts: these files are baked into the
# image, so an image staged earlier keeps whatever helper contract it was built with. That matters
# for kdive-install-kernel's exit codes (ADR-0489): it exits 75 (EX_TEMPFAIL) when the kernel
# bundle could not be fetched -- which the worker reads as the retryable `infrastructure_failure`
# -- and 1 for deterministic dracut/grubby/argv failures, which dead-letter the job on attempt 1.
# An image built before that contract exits 1 for everything; the worker maps every unrecognised
# code to `install_failure`, so such an image behaves exactly as it did before rather than being
# misclassified. Rebuild the image (force_image_rebuild=true) to give its installs the retry back.
- name: Build the virt-customize helper arguments for {{ image.name }}
  ansible.builtin.set_fact:
    guest_base_image_helper_args: >-
      {{ guest_base_image_helper_args
         + ['--copy-in', guest_base_image_helper_dir ~ '/'
            ~ ('debian/' if image.distro in ['debian', 'ubuntu']
               and item == 'kdive-install-kernel' else 'suse/'
               if image.distro == 'opensuse-leap' and item == 'kdive-install-kernel'
               else '') ~ item ~ ':/usr/local/sbin/',
            '--run-command', 'chown root:root /usr/local/sbin/' ~ item,
            '--run-command', 'chmod 0755 /usr/local/sbin/' ~ item,
            '--run-command',
            'if command -v restorecon >/dev/null 2>&1; then '
            ~ 'restorecon -v /usr/local/sbin/' ~ item ~ '; fi'] }}
  loop: "{{ guest_base_image_helpers }}"
  when: (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool

- name: Install the in-guest helpers into the image for {{ image.name }}
  ansible.builtin.command:  # noqa: command-instead-of-module
    # No Ansible module wraps virt-customize; the command module is the only option.
    argv: >-
      {{ ['virt-customize', '-a', guest_base_image_qcow2] + guest_base_image_helper_args }}
  when: (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool
  changed_when: true

# --- Verify the guest userland the external-boot identity proof reads (ADR-0590). ---
# The identity proof spawns /usr/bin/uname and /usr/bin/cat through guest-exec against a path-keyed
# allowlist, so an image exposing those applets only at /usr/sbin/busybox does not satisfy it. Every
# catalog image owes both paths, not just the scratch one. Checking here, before the copy below,
# means a non-conformant image never becomes a staged volume.
#
# Guarded like that copy: the local qcow2 exists only when a build ran, so an image already staged
# is not re-verified until force_image_rebuild. `test -x` is a shell builtin, so the check does not
# depend on the binaries it tests. `changed_when: false` describes the task's contract — it asserts
# rather than customizes — not the qcow2's bytes, which virt-customize rewrites on every invocation
# (random seed, SELinux relabel).
- name: Verify the external-boot guest userland for {{ image.name }}
  ansible.builtin.command: # noqa: command-instead-of-module
    # No Ansible module wraps virt-customize; the command module is the only option.
    argv:
      - virt-customize
      - -a
      - "{{ guest_base_image_qcow2 }}"
      - --run-command
      - >-
        test -x /usr/bin/uname && test -x /usr/bin/cat || { echo "kdive: image lacks
        /usr/bin/uname and/or /usr/bin/cat, which the external-boot identity proof spawns by
        absolute path (ADR-0590); install coreutils in this image" >&2; exit 1; }
  when: (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool
  changed_when: false

- name: Complete the pinned Leap native firstboot for {{ image.name }}
  ansible.builtin.command: # noqa: command-instead-of-module
    # Complete only the admitted fresh image through its native completion marker.
    argv:
      - virt-customize
      - -a
      - "{{ guest_base_image_qcow2 }}"
      - --run-command
      - |
        set -eu
        fail() { echo 'kdive: unsafe native firstboot state; rebuild supported Leap image' >&2; exit 1; }
        safe() {
          [ ! -L "$1" ] || fail
          metadata=$(stat -c '%u:%g:%a' -- "$1")
          [ "${metadata%:*}" = 0:0 ] && [ $((0${metadata##*:} & 022)) -eq 0 ] || fail
        }
        for root in /etc/systemd/system.control /run/systemd/system.control \
            /run/systemd/transient /run/systemd/generator.early /etc/systemd/system \
            /etc/systemd/system.attached /run/systemd/system /run/systemd/system.attached \
            /run/systemd/generator /usr/local/lib/systemd/system /usr/lib/systemd/system \
            /lib/systemd/system /run/systemd/generator.late; do
          dir=$root
          while :; do
            if [ -e "$dir" ] || [ -L "$dir" ]; then
              [ -d "$dir" ] || fail
              safe "$dir"
            fi
            [ "$dir" != / ] || break
            dir=${dir%/*}
            [ -n "$dir" ] || dir=/
          done
          for unit in jeos-firstboot.service jeos-firstboot-snapshot.service; do
            if [ "$root" != /usr/lib/systemd/system ] && { [ -e "$root/$unit" ] || [ -L "$root/$unit" ]; }; then fail; fi
          done
          for dropin in "$root"/service.d "$root"/jeos-.service.d "$root"/jeos-firstboot-.service.d \
              "$root"/jeos-firstboot.service.d "$root"/jeos-firstboot-snapshot.service.d; do
            [ -e "$dropin" ] || [ -L "$dropin" ] || continue
            [ -d "$dropin" ] || fail
            safe "$dropin"
            for conf in "$dropin"/*.conf; do
              [ -e "$conf" ] || [ -L "$conf" ] || continue
              fail
            done
          done
        done
        for dir in /var /var/lib /var/lib/YaST2; do
          [ -d "$dir" ] || fail
          safe "$dir"
        done
        for unit in jeos-firstboot.service jeos-firstboot-snapshot.service; do
          [ -f /usr/lib/systemd/system/"$unit" ] || fail
          safe /usr/lib/systemd/system/"$unit"
        done
        sha256sum -c - <<'NATIVE'
        560fffbd70cb275b23129874fc9021d0ada78be166450a4948331ed280e561da  /usr/lib/systemd/system/jeos-firstboot.service
        aca184ccdae7ba594e5f863ace6d78a2d7da8dd18c2282c53d42c5509c100c9d  /usr/lib/systemd/system/jeos-firstboot-snapshot.service
        NATIVE
        marker=/var/lib/YaST2/reconfig_system
        if [ -e "$marker" ] || [ -L "$marker" ]; then
          [ -f "$marker" ] || fail
          safe "$marker"
          size=$(stat -c '%s' -- "$marker")
          [ "$size" = 0 ] || fail
          rm -- "$marker"
        fi
        [ ! -e "$marker" ] && [ ! -L "$marker" ] || fail
  when:
    - image.name == 'opensuse-leap-15.6-kdive-remote-base'
    - image.source == 'cloud-image'
    - image.cloud_image_checksum | default('') == 'sha256:0a5720416d423f98aacaa793a57d56ec045e3dd25cd88713952660ad00da53bd'
    - (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool
  changed_when: true

- name: Stage the finished image into the (root-owned) pool for {{ image.name }}
  ansible.builtin.copy:
    src: "{{ guest_base_image_qcow2 }}"
    dest: "{{ storage_pool_target }}/{{ image.name }}.qcow2"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: (not guest_base_image_staged.stat.exists) or guest_base_image_force | bool

- name: Refresh the storage pool so libvirt sees the new volume for {{ image.name }}
  community.libvirt.virt_pool:
    name: default
    command: refresh

- name: Record the staged image sha256 for {{ image.name }}
  ansible.builtin.stat:
    path: "{{ storage_pool_target }}/{{ image.name }}.qcow2"
    checksum_algorithm: sha256
  register: guest_base_image_final

- name: Report the staged image identity for {{ image.name }}
  ansible.builtin.debug:
    msg: "Staged {{ image.name }}.qcow2 sha256={{ guest_base_image_final.stat.checksum }}"
