---
# ADR-0606: base AF_UNIX authority and its additive network route are separate opt-ins.
provider_authority_host_enabled: false
provider_authority_host_network_address: ""
provider_authority_host_network_port: null
provider_authority_host_instance: ""
provider_authority_host_additional_denied_identities: []
provider_authority_host_account: kdive-provider-authority
provider_authority_host_home: /var/lib/kdive/provider-authority
provider_authority_host_libvirt_restart_handler: Restart provider authority libvirt after deployed changes
# Stage the exact reviewed checkout and provision Python 3.14 + uv before this role.
# No interpreter download, external package repository, or source checkout is implicit.
provider_authority_host_source_root: ""
provider_authority_host_python: /usr/bin/python3
provider_authority_host_uv_bin: /usr/local/bin/uv
provider_authority_host_database_dsn_source: ""
provider_authority_host_server_key_source: ""
provider_authority_host_server_certificate_source: ""
provider_authority_host_server_ca_source: ""
provider_authority_host_worker_client_ca_source: ""
provider_authority_host_health_client_certificate_source: ""
provider_authority_host_health_client_key_source: ""
# Identity-only remains the default. Enabling mutation is a closed contract: every value below
# must be supplied and validated before the role changes the target host.
provider_authority_host_local_mutation_enabled: false
provider_authority_host_recovery_root: /var/lib/kdive/provider-authority/recovery
provider_authority_host_rootfs_root: /var/lib/kdive/provider-authority/rootfs
provider_authority_host_console_root: /var/lib/kdive/provider-authority/console
provider_authority_host_external_boot_capacity_bytes: null
provider_authority_host_s3_endpoint_url: ""
provider_authority_host_s3_bucket: ""
provider_authority_host_s3_region: us-east-1
# boto3 shared-credentials file containing the profile selected by AWS_PROFILE (default profile
# when AWS_PROFILE is unset). Credential contents never enter Ansible facts or environment files.
provider_authority_host_s3_credentials_source: ""
# Remote module authority is a separate explicit capability. The selected architectures must
# have pinned appliance assets installed before this is enabled.
provider_authority_host_remote_module_enabled: false
provider_authority_host_remote_module_architectures: []
provider_authority_host_remote_libvirt_storage_pool: default
# Authority-owned System provisioning remains disabled until an operator supplies one canonical
# manifest and the corresponding immutable private base images. Local and remote bases are
# deliberately separate so their target roots cannot be caller-selected.
provider_authority_host_system_manifest_source: ""
provider_authority_host_system_local_bases: []
provider_authority_host_system_remote_bases: []
# ADR-0622 test-only control surface; absent unless explicitly enabled on a disposable proof host.
provider_authority_host_fault_proof_enabled: false
provider_authority_host_packages:
  Debian: [acl, git, build-essential, pkg-config, python3-dev, libvirt-dev, libelf-dev, libdw-dev, libkdumpfile-dev, e2fsprogs]
  RedHat: [acl, git, gcc, make, pkgconf-pkg-config, python3-devel, libvirt-devel, elfutils-libelf-devel, elfutils-devel, libkdumpfile-devel, e2fsprogs]
provider_authority_host_local_packages:
  Debian: [libguestfs-tools, python3-guestfs]
  RedHat: [libguestfs-tools-c, python3-libguestfs]
provider_authority_host_qemu_packages:
  Debian:
    x86_64: qemu-system-x86
    ppc64le: qemu-system-ppc
  RedHat:
    x86_64: qemu-kvm
    ppc64le: qemu-kvm
