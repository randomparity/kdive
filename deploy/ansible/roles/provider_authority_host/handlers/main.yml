---
- name: Reload systemd after authority removal
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart provider authority libvirt after deployed changes
  ansible.builtin.systemd_service:
    name: kdive-libvirtd-external-boot-authority.service
    scope: user
    daemon_reload: true
    state: restarted
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ provider_authority_host_uid }}"
  become: true
  become_user: kdive-provider-authority

- name: Restart provider authority after deployed changes
  ansible.builtin.systemd_service:
    name: kdive-external-boot-authority.service
    daemon_reload: true
    state: restarted
