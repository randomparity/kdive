---
- name: Validate production authority inputs
  ansible.builtin.import_tasks: preflight.yml

- name: Quiesce changed authority routes before firewall reconciliation
  ansible.builtin.import_tasks: prepare.yml

- name: Converge the production authority
  block:
    - name: Identify firewall convergence for bounded failure reporting
      ansible.builtin.set_fact:
        provider_authority_host_failure_phase: Protected-port firewall convergence

    - name: Apply the shared protected-port firewall owner
      ansible.builtin.include_role:
        name: gdbstub_acl
      vars:
        gdbstub_acl_authority_port: "{{ provider_authority_host_network_port if provider_authority_host_enabled else none }}"

    - name: Identify authority convergence for bounded failure reporting
      ansible.builtin.set_fact:
        provider_authority_host_failure_phase: >-
          {{ 'Provider authority convergence or readiness' if provider_authority_host_enabled
             else 'Disabled provider authority cleanup' }}

    - name: Install the enabled production authority
      ansible.builtin.include_tasks: install.yml
      when: provider_authority_host_enabled | bool

    - name: Remove disabled production authority execution material
      ansible.builtin.include_tasks: disable.yml
      when: not provider_authority_host_enabled | bool
  rescue:
    - name: Inspect the authority unit after failed convergence
      ansible.builtin.stat:
        path: /etc/systemd/system/kdive-external-boot-authority.service
        follow: false
      register: provider_authority_host_failed_unit

    - name: Keep failed authority readiness withdrawn
      ansible.builtin.systemd_service:
        name: kdive-external-boot-authority.service
        state: stopped
      when: provider_authority_host_failed_unit.stat.exists

    - name: Fail the authority deployment with bounded diagnostics
      ansible.builtin.fail:
        msg: >-
          {{ provider_authority_host_failure_phase | default('Provider host convergence') }} failed;
          any installed authority service remains stopped.
