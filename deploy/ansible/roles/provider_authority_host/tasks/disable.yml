---
- name: Stop and disable the retired authority service
  ansible.builtin.systemd_service:
    name: kdive-external-boot-authority.service
    state: stopped
    enabled: false
  when: provider_authority_host_existing_unit.stat.exists

- name: Inspect the private authority provider unit
  ansible.builtin.stat:
    path: /var/lib/kdive/provider-authority/.config/systemd/user/kdive-libvirtd-external-boot-authority.service
    follow: false
  register: provider_authority_host_retired_libvirt

- name: Stop the retired private provider endpoint
  when: provider_authority_host_retired_libvirt.stat.exists
  block:
    - name: Resolve the retiring authority identity
      ansible.builtin.getent:
        database: passwd
        key: kdive-provider-authority

    - name: Stop and disable the retired authority provider user unit
      ansible.builtin.systemd_service:
        name: kdive-libvirtd-external-boot-authority.service
        scope: user
        state: stopped
        enabled: false
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd['kdive-provider-authority'][1] }}"
      become: true
      become_user: kdive-provider-authority

- name: Remove only authority execution configuration and copied credentials
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/kdive-external-boot-authority.service
    - /etc/kdive/provider-authority.env
    - /etc/kdive/credentials/provider-authority
    - /etc/kdive/libvirtd-external-boot-authority.conf
    - /etc/tmpfiles.d/kdive-provider-authority.conf
    - /var/lib/kdive/provider-authority/.config/systemd/user/kdive-libvirtd-external-boot-authority.service
    - /var/lib/kdive/provider-authority/.ansible
    - /run/kdive/provider-authority
    - /opt/kdive-provider-authority
  register: provider_authority_host_removed
  notify: Reload systemd after authority removal

- name: Resolve the retiring authority identity for its user manager drop-in
  ansible.builtin.getent:
    database: passwd
    key: kdive-provider-authority
    fail_key: false

- name: Remove the retired authority user manager memlock drop-in
  ansible.builtin.file:
    path: >-
      /etc/systemd/system/user@{{ ansible_facts.getent_passwd['kdive-provider-authority'][1]
      }}.service.d/kdive-memlock.conf
    state: absent
  when: ansible_facts.getent_passwd['kdive-provider-authority'] | default(none) is not none
  notify: Reload systemd after authority removal

# Removing the drop-in changes only the unit's configured limit; a lingering manager keeps its
# unlimited ceiling until it restarts (ADR-0708). A re-run whose removal reports ok notifies no
# handler, and systemctl show reports the loaded limit until a reload, so this reload is
# unconditional. The restart precedes disabling linger, which may stop the manager instead.
- name: Reload systemd before reading the retiring authority user manager
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Read the retiring authority user manager main PID
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - --property=MainPID
      - --value
      - "user@{{ ansible_facts.getent_passwd['kdive-provider-authority'][1] }}.service"
  register: provider_authority_host_retired_manager_pid
  changed_when: false
  when: ansible_facts.getent_passwd['kdive-provider-authority'] | default(none) is not none

- name: Read the retiring authority user manager configured memlock limit
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - --property=LimitMEMLOCK
      - --value
      - "user@{{ ansible_facts.getent_passwd['kdive-provider-authority'][1] }}.service"
  register: provider_authority_host_retired_configured_memlock
  changed_when: false
  when: ansible_facts.getent_passwd['kdive-provider-authority'] | default(none) is not none

- name: Read the retiring authority user manager running memlock limit
  ansible.builtin.command:
    argv:
      - /usr/bin/prlimit
      - --memlock
      - --noheadings
      - --output=HARD
      - "--pid={{ provider_authority_host_retired_manager_pid.stdout }}"
  register: provider_authority_host_retired_running_memlock
  changed_when: false
  when:
    - ansible_facts.getent_passwd['kdive-provider-authority'] | default(none) is not none
    - provider_authority_host_retired_manager_pid.stdout not in ["", "0"]

- name: Restart the retiring authority user manager to drop its memlock ceiling
  ansible.builtin.systemd_service:
    name: "user@{{ ansible_facts.getent_passwd['kdive-provider-authority'][1] }}.service"
    state: restarted
  when:
    - ansible_facts.getent_passwd['kdive-provider-authority'] | default(none) is not none
    - provider_authority_host_retired_manager_pid.stdout not in ["", "0"]
    - provider_authority_host_retired_running_memlock.stdout | trim == 'unlimited'
    - provider_authority_host_retired_configured_memlock.stdout | trim != 'infinity'

- name: Retire authority user-service boot persistence
  ansible.builtin.command:
    argv: [loginctl, disable-linger, kdive-provider-authority]
    removes: /var/lib/systemd/linger/kdive-provider-authority

- name: Apply authority removal before completing cleanup
  ansible.builtin.meta: flush_handlers
