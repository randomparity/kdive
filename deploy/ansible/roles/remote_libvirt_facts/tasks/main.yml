---
- name: Assert gdb_addr is set for this host
  ansible.builtin.assert:
    that:
      - gdb_addr | default('', true) | length > 0
    fail_msg: >-
      Host '{{ inventory_hostname }}' is missing gdb_addr.
      Set it in inventory/host_vars/{{ inventory_hostname }}.yml.

- name: Assert this host selects at least one image
  ansible.builtin.assert:
    that: (kdive_requested_images | length) > 0
    fail_msg: >-
      host_images is empty for '{{ inventory_hostname }}'; the emitted systems.toml
      would carry no [[image]] block. Set host_images in
      host_vars/{{ inventory_hostname }}.yml.

- name: Assert host_default_image is one of this host's selected images
  ansible.builtin.assert:
    that: kdive_default_image in kdive_requested_images
    fail_msg: >-
      host_default_image '{{ kdive_default_image }}' is not in host_images
      {{ kdive_requested_images }} for '{{ inventory_hostname }}'. The emitted
      [[remote_libvirt]].base_image must name a staged [[image]] or the app
      rejects systems.toml at load.

# A `[[image]]` with `[image.source] kind = "staged"` is a claim that the named volume is
# already in the host's pool. This play runs in site.yml, which does NOT build images — that
# is the separate opt-in playbooks/image.yml — and the guest_base_image role skips entries
# this host cannot build (ADR-0481, #1629). So the selection alone proves nothing: declaring
# every selected entry registered catalog rows provisioning could only fail on, and a
# never-built image looked available until a System tried to boot it.
#
# Confirm each volume by the same check build_one.yml uses for its own idempotence — a stat
# of the staged path in the pool — and let the template declare only what stats back. This
# runs unprivileged: the pool dir is mode 0711, so traversal to a known filename works
# without listing it, and a genuinely unreadable pool makes stat fail loudly rather than
# report a false absence.
- name: Check which selected image volumes are actually staged on this host
  ansible.builtin.stat:
    path: "{{ storage_pool_target }}/{{ item.name }}.qcow2"
  loop: "{{ kdive_selected_images }}"
  loop_control:
    label: "{{ item.name }}"
  register: remote_libvirt_facts_volumes

# --- Stage-time verification of the external-boot guest userland (ADR-0590, #2160). ---
#
# A stat proves the volume is there; it says nothing about what is inside it. The build-time
# check that does say so carries the staging copy's guard, so it fires only when a build ran —
# an image staged before ADR-0590, or built outside guest_base_image, reaches an `[[image]]`
# block having never been checked. This is the stage-time half ADR-0590 Decision 4 adds: the
# last point before a volume becomes a catalog row a System can select.
#
# The verdict is cached against the volume's size and mtime and the contract's own identity, so
# the appliance runs once per image per restaging rather than once per site.yml run.
- name: Ensure the userland verdict cache dir exists
  ansible.builtin.file:
    path: "{{ remote_libvirt_facts_userland_cache_dir }}"
    state: directory
    mode: "0755"
  when: remote_libvirt_facts_userland_verify | bool

- name: Look up the cached userland verdict for each confirmed volume
  vars:
    volume: "{{ item.item }}"
  ansible.builtin.stat:
    path: >-
      {{ remote_libvirt_facts_userland_cache_dir }}/{{ volume.name }}.{{ item.stat.size
      }}.{{ item.stat.mtime | int }}.{{ remote_libvirt_facts_userland_contract_id }}
  loop: "{{ remote_libvirt_facts_volumes.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: remote_libvirt_facts_userland_cache
  when: remote_libvirt_facts_userland_verify | bool

# One appliance launch per unverified volume. `--ro` is the whole point: this opens a volume
# other Systems clone from, so the instrument must not write to what it inspects.
#
# `followsymlinks:true` is required, not decorative. A busybox image supplies /usr/bin/cat as a
# symlink to /usr/sbin/busybox, and that DOES satisfy the identity proof — the kernel follows the
# link on exec. Without the flag `is-file` lstats and reports false, and the role would omit a
# conformant image.
#
# `failed_when: false` here because the next task classifies rc rather than the shell doing it:
# an absent program and an uninspectable volume are different answers and must not share a
# failure. Note the split this relies on, which is a property of guestfish and is verified in
# the render harness: inspection failure writes to stderr and leaves stdout EMPTY, while an
# absent program is a normal `false` on stdout with rc 0.
#
# This verifies presence-as-a-file, not the execute bit the build-time check tests. Reading the
# mode needs `stat`, which fails on an absent path and so collapses "not there" into "could not
# look" — the one distinction this role must keep. ADR-0590 Decision 4 records the narrowing.
- name: Verify the external-boot guest userland in each unverified staged volume
  vars:
    volume_name: "{{ item.item.item.name }}"
  ansible.builtin.command:
    argv:
      - guestfish
      - --ro
      - --add
      - "{{ storage_pool_target }}/{{ volume_name }}.qcow2"
      - --inspector
    # Double-quoted so YAML itself produces the newline: in a folded scalar `\n` reaches
    # guestfish as a literal backslash-n and the whole script arrives as one unknown command.
    stdin: "{{ kdive_external_boot_userland_programs | map('regex_replace', '^(.*)$', 'is-file \\1 followsymlinks:true') | join('\n') }}"
  loop: >-
    {{ remote_libvirt_facts_userland_cache.results | default([])
       | rejectattr('stat.exists') | list }}
  loop_control:
    label: "{{ item.item.item.name }}"
  register: remote_libvirt_facts_userland_probe
  changed_when: false
  failed_when: false
  when: remote_libvirt_facts_userland_verify | bool

# A volume that could not be inspected is NOT folded into the missing set. If it were, one host
# without a working libguestfs would emit an empty fragment and break provisioning everywhere
# with nothing naming the cause — the same false-absence the stat comment above refuses.
- name: Fail loudly when a staged volume could not be inspected at all
  vars:
    volume_name: "{{ probe.item.item.item.name }}"
  ansible.builtin.assert:
    that:
      - probe.rc | default(1) == 0
      - (probe.stdout_lines | default([]) | length)
        == (kdive_external_boot_userland_programs | length)
    fail_msg: >-
      {{ inventory_hostname }}: could not inspect
      {{ storage_pool_target }}/{{ volume_name }}.qcow2 for the external-boot guest userland
      (ADR-0590). guestfish exited {{ probe.rc | default('(not run)') }}:
      {{ (probe.stderr | default('') | trim) or (probe.msg | default('') | trim)
         or 'no output' }}.
      This is not a verdict about the image — the check could not run, so the volume is neither
      confirmed nor denied. Install libguestfs-tools on this host, or set
      remote_libvirt_facts_userland_verify=false to declare volumes unverified.
  loop: "{{ remote_libvirt_facts_userland_probe.results | default([]) }}"
  loop_control:
    loop_var: probe
    label: "{{ probe.item.item.item.name }}"

# Record the pass so the next run skips the appliance. Only conformant volumes get a marker:
# a failing one must be re-checked, since the fix is to restage it.
- name: Cache the userland verdict for each volume that passed
  vars:
    volume: "{{ item.item.item }}"
  ansible.builtin.file:
    path: >-
      {{ remote_libvirt_facts_userland_cache_dir }}/{{ volume.item.name }}.{{ volume.stat.size
      }}.{{ volume.stat.mtime | int }}.{{ remote_libvirt_facts_userland_contract_id }}
    state: touch
    mode: "0644"
  loop: >-
    {{ remote_libvirt_facts_userland_probe.results | default([])
       | rejectattr('stdout_lines', 'contains', 'false') | list }}
  loop_control:
    label: "{{ volume.item.name }}"
  changed_when: false

- name: Split the selection into confirmed and unconfirmed volumes
  vars:
    # Verified this run, plus those a cached verdict already cleared.
    userland_ok: >-
      {{ (remote_libvirt_facts_userland_cache.results | default([])
          | selectattr('stat.exists') | map(attribute='item.item.name') | list)
         + (remote_libvirt_facts_userland_probe.results | default([])
            | rejectattr('stdout_lines', 'contains', 'false')
            | map(attribute='item.item.item.name') | list) }}
    present: >-
      {{ remote_libvirt_facts_volumes.results
         | selectattr('stat.exists') | map(attribute='item.name') | list }}
  ansible.builtin.set_fact:
    remote_libvirt_facts_staged: >-
      {{ kdive_selected_images
         | selectattr('name', 'in', remote_libvirt_facts_userland_verify | bool
                                    | ternary(userland_ok, present)) | list }}
    remote_libvirt_facts_missing: >-
      {{ kdive_selected_images
         | rejectattr('name', 'in', remote_libvirt_facts_userland_verify | bool
                                    | ternary(userland_ok, present)) | list }}
    # Staged, inspected, and non-conformant — omitted for a different reason than absence, and
    # with a different remedy, so the fragment must not report it as "no volume".
    remote_libvirt_facts_unverified: >-
      {{ remote_libvirt_facts_userland_probe.results | default([])
         | selectattr('stdout_lines', 'contains', 'false')
         | map(attribute='item.item.item.name') | list }}

# An unconfirmed DEFAULT image is the one case the operator must not paste past: the emitted
# base_image would name an image the fragment does not declare. That is rejected by
# InventoryDoc.parse at load (model.py _check_base_image_refs) instead of surfacing as a
# provision failure later, and the file's header comment says which playbook to run. Warn
# rather than fail: site.yml legitimately runs before playbooks/image.yml on a fresh host
# (deploy/ansible/README.md usage steps 2 and 3), and re-running site.yml afterwards
# regenerates a complete fragment.
- name: Warn when the emitted fragment is incomplete
  vars:
    absent: >-
      {{ remote_libvirt_facts_missing | map(attribute='name')
         | reject('in', remote_libvirt_facts_unverified | default([])) | list }}
    unverified: "{{ remote_libvirt_facts_unverified | default([]) }}"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: those [[image]] blocks are omitted.
      {% if absent %}No staged volume for {{ absent | join(', ') }} — run playbooks/image.yml,
      then re-run site.yml to regenerate.{% endif %}
      {% if unverified %}Staged but lacking the external-boot guest userland (ADR-0590):
      {{ unverified | join(', ') }} — rebuild those with force_image_rebuild=true.{% endif %}
  when: remote_libvirt_facts_missing | length > 0

- name: Ensure the controller artifacts dir exists
  ansible.builtin.file:
    path: "{{ pki_artifacts_dir }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  run_once: false

- name: Render the systems.toml block for this host (controller-side)
  ansible.builtin.template:
    src: systems_toml_block.j2
    dest: "{{ pki_artifacts_dir }}/{{ inventory_hostname }}-systems.toml"
    mode: "0640"
  delegate_to: localhost
