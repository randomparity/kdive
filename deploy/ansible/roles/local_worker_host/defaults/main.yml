---
# Existing operator account owning shared local-libvirt data.
local_worker_host_operator_user: ""

# Kernel-debug toolchain + venv build deps the live_vm contract needs beyond libvirt_stack, on
# the Ubuntu 26.04 runner base (ADR-0387). drgn and libvirt-python are built from PyPI into the
# venv, so their -dev headers (libvirt-dev, libelf/libdw/libkdumpfile) are build deps here;
# libguestfs has no PyPI package and is symlinked from the system python3-guestfs binding.
live_vm_host_packages:  # noqa: var-naming[no-role-prefix]
  - bubblewrap         # unreadable-/proc carrier in test-compose-lifecycle
  - crash
  - makedumpfile
  - kexec-tools
  - kdump-tools        # Debian name for kdump-utils
  - gdb
  - kmod               # depmod: host-side kernel module indexing (ADR-0346, #2300, #2331)
  - python3-guestfs    # the system libguestfs binding, built for Ubuntu 26.04's Python 3.14
  - elfutils           # eu-readelf: the live-vm store scripts read the kernel/debuginfo build-id (#1292)
  - debuginfod         # debuginfod-find: fetch matching vmlinux debuginfo by build-id (#1292)
  - git
  - python3-pip        # Ubuntu ships no pip for the system python; uv needs it
  - python3-dev        # Python.h: uv builds drgn + libvirt-python from source
  - build-essential    # gcc/make: uv builds drgn + libvirt-python from source
  - pkg-config
  - libvirt-dev        # libvirt-python build
  - login              # sg: refresh the fixed daemon's declared group at each user-unit start
  - libelf-dev         # drgn build
  - libdw-dev          # drgn build
  - libkdumpfile-dev   # drgn kdump support
  - libssl-dev         # grpcio source build on ppc64le (no wheel, no BoringSSL target, #2666)
  - zlib1g-dev         # grpcio source build on ppc64le (paired with libssl-dev above, #2666)

# pip installs the uv console script to /usr/local/bin, which root's sudo secure_path lists
# (#2506, #2665) unlike a user-local ~/.local/bin install. Reference uv by absolute path in a
# venv-build command so it is found under become regardless of sudo's PATH handling; override if
# pip is configured to install console scripts elsewhere. Shared with live_vm_host, which installs
# and consumes this identically (tasks/uv.yml).
live_vm_host_uv_bin: /usr/local/bin/uv  # noqa: var-naming[no-role-prefix]

# Fixed host-worker authority contract (ADR-0574). Keep the slot count literal: unit names,
# account isolation, and lifecycle bounds all use exactly 1..8.
# Preserve these inventory names across runner and standalone role use.
# ansible-lint role-prefix exceptions below keep existing inventory overrides working.
live_vm_host_worker_accounts:  # noqa: var-naming[no-role-prefix]
  - kdive-worker-1
  - kdive-worker-2
  - kdive-worker-3
  - kdive-worker-4
  - kdive-worker-5
  - kdive-worker-6
  - kdive-worker-7
  - kdive-worker-8
live_vm_host_worker_control_group: kdive-live-control  # noqa: var-naming[no-role-prefix]
live_vm_host_worker_libvirt_group: kdive-live-libvirt  # noqa: var-naming[no-role-prefix]
live_vm_host_worker_state_root: /var/lib/kdive/live-workers  # noqa: var-naming[no-role-prefix]
live_vm_host_worker_shared_directories:  # noqa: var-naming[no-role-prefix]
  - /var/lib/kdive/rootfs
  - /var/lib/kdive/console
  - /var/lib/kdive/pcap
  - /var/lib/kdive/build
  - /var/lib/kdive/install
# Local external-boot recovery roots (ADR-0586, #2210) use one owner-only child per worker.
# The traverse-only root remains root-owned so a worker cannot replace sibling roots.
live_vm_host_worker_recovery_root: /var/lib/kdive/live-workers/external-boot-recovery  # noqa: var-naming[no-role-prefix]
# Per activation; the capacity gate reserves this many bytes for each admitted activation.
live_vm_host_external_boot_capacity_bytes: 34359738368  # noqa: var-naming[no-role-prefix]
# Admitted recovery concurrency sizes the storage floor independently of the eight worker slots.
live_vm_host_external_boot_concurrent_activations: 8  # noqa: var-naming[no-role-prefix]
live_vm_host_worker_authority_enabled: false  # noqa: var-naming[no-role-prefix]
live_vm_host_authority_client_group: kdive-provider-authority-client  # noqa: var-naming[no-role-prefix]

# Fedora worker debug/build packages; QEMU/libvirt host packages belong to libvirt_stack.
local_worker_host_packages_redhat:
  - bubblewrap
  - crash
  - makedumpfile
  - kexec-tools
  - kdump-utils
  - gdb
  - kmod
  - python3-libguestfs
  - elfutils
  - elfutils-debuginfod-client
  - git
  - python3-pip
  - gcc
  - make
  - pkgconf-pkg-config
  - libvirt-devel
  - shadow-utils
  - elfutils-libelf-devel
  - elfutils-devel
  - libkdumpfile-devel
  - openssl-devel       # grpcio source build on ppc64le (no wheel, no BoringSSL target, #2666)
  - zlib-devel          # grpcio source build on ppc64le (paired with openssl-devel above, #2666)

# Container runtime for the on-box compose stack (scripts/live-stack/stack-services.sh) and the
# testcontainers gate, split into engine and compose halves because they carry different gates.
# Both stay out of the family list above: that list installs on every RedHat-family host, and
# Enterprise Linux packages no engine in baseos, appstream, extras or CRB, so naming one there
# would fail dnf — the defect these declarations exist to avoid, not repeat.
#
# The compose plugin is what provides the `docker compose` subcommand stack-services.sh invokes;
# the engine does not carry it. Fedora's docker-compose requires `(docker-cli or podman-docker)`,
# so it installs over whichever provider the host has and needs no engine gate — but on a host
# with neither, dnf satisfies that dependency by pulling docker-cli, which owns /usr/bin/docker.
# That is why the task file probes and installs the engine BEFORE the plugin.
#
# Fedora's RPM leaves docker.service disabled — its preset enables only docker.socket — and its
# sysusers entry creates the docker group empty. tasks/container_runtime.yml enables and starts the
# service and adds the caller's operator account to that group (ADR-0663, #2557), so the packages
# below are a working runtime rather than a declared one.
local_worker_host_compose_packages_fedora:
  - docker-compose

# Engine for a host that has no /usr/bin/docker provider yet. podman-docker declares
# `Conflicts: moby-engine` and docker-cli declares `Conflicts: podman-docker`, so installing the
# engine over the podman route this project's own setup hint recommends would abort the dnf
# transaction rather than converge. A host with a provider already keeps the one it chose.
local_worker_host_engine_packages_fedora:
  - moby-engine

# openSUSE Tumbleweed worker debug/build packages.
local_worker_host_packages_suse:
  - bubblewrap
  - crash
  - makedumpfile
  - kexec-tools
  - kdump
  - gdb
  - kmod
  - python3-libguestfs
  - elfutils
  - debuginfod-client
  - git
  - python3-pip
  - gcc
  - make
  - pkg-config
  - libvirt-devel
  - shadow
  - libelf-devel
  - libdw-devel
  - libkdumpfile-devel
  - libopenssl-devel    # grpcio source build on ppc64le (no wheel, no BoringSSL target, #2666)
  - zlib-devel          # grpcio source build on ppc64le (paired with libopenssl-devel, #2666)

# The Tumbleweed counterparts, kept out of the list above for the same reason: that list also
# installs on SLES, which preflight.yml admits and which ships Docker only in the Containers
# Module rather than the base product. Tumbleweed's docker-compose is Compose V2, installed as the
# `docker compose` CLI plugin, and requires `(docker or podman)` so it needs no engine gate — but
# on a host with neither, zypper satisfies that dependency by pulling the package that owns
# /usr/bin/docker. That is why the task file probes and installs the engine BEFORE the plugin.
# tasks/container_runtime.yml enables the daemon and grants the socket group here too.
local_worker_host_compose_packages_tumbleweed:
  - docker-compose

local_worker_host_engine_packages_tumbleweed:
  - docker

# The engine's systemd identity, named once so tasks and tests share the literals. The probe path
# is where every family that packages an engine installs the unit — verified on Fedora 44
# (moby-engine), Ubuntu 26.04 (docker.io) and Tumbleweed (docker) — and where a docker-ce install
# from Docker's own repository puts it too (ADR-0663).
local_worker_host_engine_service: docker.service
local_worker_host_engine_unit_path: /usr/lib/systemd/system/docker.service
# The socket unit's SocketGroup on all three: its socket is root:docker 0660, so a non-root
# operator outside this group cannot reach the daemon and stack-services.sh fails (#2557).
local_worker_host_engine_socket_group: docker
