# Installed by the local_worker_host Ansible role (packages_debian.yml). Do not edit by hand.
#
# needrestart's post-upgrade restart mints a new INVOCATION_ID for kdive-live-worker@N.service.
# The lifecycle witness binds each slot's release marker to that unit's INVOCATION_ID
# (ADR-0574), so an out-of-band restart is refused by the gate and wedges the slot until an
# operator runs scripts/live-stack/worker-lifecycle.sh recover (#2481, #2663). The lifecycle
# witness must stay the only path that starts or stops a worker unit, so tell needrestart not
# to select these units for restart.
$nrconf{override_rc}{qr(^kdive-live-worker@.+\.service$)} = 0;
