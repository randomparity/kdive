---
- name: Require complete remote-libvirt client TLS sources
  ansible.builtin.assert:
    that: item | length > 0
    quiet: true
    fail_msg: Supply the client certificate, key and CA sources together.
  loop:
    - "{{ local_worker_host_remote_libvirt_client_certificate_source }}"
    - "{{ local_worker_host_remote_libvirt_client_key_source }}"
    - "{{ local_worker_host_remote_libvirt_ca_certificate_source }}"
  no_log: true

- name: Inspect remote-libvirt client TLS sources on the controller
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop:
    - "{{ local_worker_host_remote_libvirt_client_certificate_source }}"
    - "{{ local_worker_host_remote_libvirt_client_key_source }}"
    - "{{ local_worker_host_remote_libvirt_ca_certificate_source }}"
  delegate_to: localhost
  become: false
  register: local_worker_host_remote_tls_sources
  no_log: true

- name: Require protected regular remote-libvirt client TLS sources
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
      - item.stat.size > 0
      - item.stat.mode in ['0400', '0600']
    quiet: true
  loop: "{{ local_worker_host_remote_tls_sources.results }}"
  no_log: true

- name: Inspect fixed remote-libvirt secrets directories without following links
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - /var/lib/kdive/secrets
    - /var/lib/kdive/secrets/remote-libvirt
  register: local_worker_host_remote_tls_directories

- name: Refuse substituted remote-libvirt secrets directories
  ansible.builtin.assert:
    that: >-
      not item.stat.exists or (item.stat.isdir and not item.stat.islnk)
    fail_msg: Restore a real secrets directory before installing remote-libvirt TLS refs.
  loop: "{{ local_worker_host_remote_tls_directories.results }}"

- name: Create protected remote-libvirt secrets directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    follow: false
  loop:
    - {path: /var/lib/kdive/secrets, group: root, mode: "0711"}
    - path: /var/lib/kdive/secrets/remote-libvirt
      group: "{{ live_vm_host_worker_libvirt_group }}"
      mode: "0750"

- name: Install protected remote-libvirt client TLS files
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "/var/lib/kdive/secrets/remote-libvirt/{{ item.name }}"
    owner: root
    group: "{{ live_vm_host_worker_libvirt_group }}"
    mode: "0440"
    follow: false
  loop:
    - name: clientcert.pem
      source: "{{ local_worker_host_remote_libvirt_client_certificate_source }}"
    - name: clientkey.pem
      source: "{{ local_worker_host_remote_libvirt_client_key_source }}"
    - name: cacert.pem
      source: "{{ local_worker_host_remote_libvirt_ca_certificate_source }}"
  no_log: true
  diff: false
