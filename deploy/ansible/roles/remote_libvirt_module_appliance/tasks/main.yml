---
- name: Validate the selected module-appliance architectures
  ansible.builtin.assert:
    that:
      - provider_authority_host_remote_module_architectures is sequence
      - provider_authority_host_remote_module_architectures is not string
      - provider_authority_host_remote_module_architectures | length > 0
      - >-
        provider_authority_host_remote_module_architectures | unique | list | length ==
        provider_authority_host_remote_module_architectures | length
      - >-
        provider_authority_host_remote_module_architectures |
        difference(['x86_64', 'ppc64le']) | length == 0
      - remote_libvirt_module_appliance_images.keys() | list == ['x86_64', 'ppc64le']
    fail_msg: >-
      provider_authority_host_remote_module_architectures must select unique supported
      architectures from x86_64 and ppc64le.

- name: Validate the pinned selected module-appliance image catalog
  ansible.builtin.assert:
    that:
      - item.value.url is match('^(https|file)://')
      - item.value.sha256 is match('^[0-9a-f]{64}$')
    fail_msg: >-
      Selected remote_libvirt_module_appliance_images entries must pin HTTPS or
      controller-staged file URLs and lowercase SHA-256 digests.
  loop: "{{ remote_libvirt_module_appliance_images | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.key in provider_authority_host_remote_module_architectures

- name: Create the read-only module-appliance image directory
  ansible.builtin.file:
    path: "{{ remote_libvirt_module_appliance_install_dir }}"
    state: directory
    owner: "{{ remote_libvirt_module_appliance_owner }}"
    group: "{{ remote_libvirt_module_appliance_group }}"
    mode: "0755"

- name: Download and digest-verify each selected module-appliance image
  ansible.builtin.get_url:
    url: "{{ item.value.url }}"
    dest: "{{ remote_libvirt_module_appliance_install_dir }}/appliance-v1-{{ item.key }}.tar"
    checksum: "sha256:{{ item.value.sha256 }}"
    owner: "{{ remote_libvirt_module_appliance_owner }}"
    group: "{{ remote_libvirt_module_appliance_group }}"
    mode: "0444"
  loop: "{{ remote_libvirt_module_appliance_images | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.key in provider_authority_host_remote_module_architectures

- name: Create selected architecture-specific module-appliance directories
  ansible.builtin.file:
    path: "{{ remote_libvirt_module_appliance_install_dir }}/{{ item.key }}"
    state: directory
    owner: "{{ remote_libvirt_module_appliance_owner }}"
    group: "{{ remote_libvirt_module_appliance_group }}"
    mode: "0755"
  loop: "{{ remote_libvirt_module_appliance_images | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.key in provider_authority_host_remote_module_architectures

- name: Extract the verified selected module-appliance bundles
  ansible.builtin.unarchive:
    src: "{{ remote_libvirt_module_appliance_install_dir }}/appliance-v1-{{ item.key }}.tar"
    dest: "{{ remote_libvirt_module_appliance_install_dir }}/{{ item.key }}"
    remote_src: true
    owner: "{{ remote_libvirt_module_appliance_owner }}"
    group: "{{ remote_libvirt_module_appliance_group }}"
    mode: "u=rX,go=rX"
  loop: "{{ remote_libvirt_module_appliance_images | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.key in provider_authority_host_remote_module_architectures

- name: Re-read installed selected module-appliance image digests
  ansible.builtin.stat:
    path: "{{ remote_libvirt_module_appliance_install_dir }}/appliance-v1-{{ item.key }}.tar"
    checksum_algorithm: sha256
  loop: "{{ remote_libvirt_module_appliance_images | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.key in provider_authority_host_remote_module_architectures
  register: remote_libvirt_module_appliance_installed

- name: Refuse a changed installed selected module-appliance image
  ansible.builtin.assert:
    that:
      - item.stat.isreg
      - item.stat.checksum == item.item.value.sha256
      - item.stat.mode == '0444'
    fail_msg: >-
      Installed module-appliance image {{ item.item.key }} does not match its pinned
      digest or immutable file mode.
  loop: "{{ remote_libvirt_module_appliance_installed.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: not (item.skipped | default(false))
