---
all:
  hosts:
    # Declared so localhost-targeted plays run against a real inventory host instead of the
    # implicit one. Deliberately carries no ansible_python_interpreter: every play reading this
    # inventory would inherit it, and pki.yml resolves community.crypto against the project
    # environment. A play needing the system interpreter pins it itself (#2498).
    localhost:
      ansible_connection: local
  children:
    remote_libvirt_hosts:
      hosts:
        ub26-big:
        fed44-big:
        rock10-big:
    live_vm_runners:
      hosts:
        ub26-runner:
