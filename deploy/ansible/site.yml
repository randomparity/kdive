---
- name: Install the virtualization stack (switch-to-modular)
  hosts: remote_libvirt_hosts
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate authority opt-in inputs before any remote host mutation
      ansible.builtin.import_role:
        name: provider_authority_host
        tasks_from: preflight
  roles:
    - libvirt_stack

- name: Configure mutual-TLS listener
  hosts: remote_libvirt_hosts
  become: true
  gather_facts: true
  roles:
    - libvirt_tls

- name: Define the storage pool and network
  hosts: remote_libvirt_hosts
  become: true
  gather_facts: true
  roles:
    - libvirt_pool_net

- name: Install pinned remote module-restoration appliance images
  hosts: remote_libvirt_hosts
  become: true
  gather_facts: false
  roles:
    - role: remote_libvirt_module_appliance
      when: remote_libvirt_module_appliance_enabled | bool

- name: Apply protected-port ACLs and the optional provider authority
  hosts: remote_libvirt_hosts
  become: true
  gather_facts: true
  roles:
    - provider_authority_host

- name: Emit remote-libvirt facts (controller-side)
  hosts: remote_libvirt_hosts
  gather_facts: true
  roles:
    - remote_libvirt_facts
