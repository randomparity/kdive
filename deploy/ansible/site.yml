---
- name: Install the virtualization stack (switch-to-modular)
  hosts: remote_libvirt_hosts
  become: true
  gather_facts: true
  roles:
    - libvirt_stack

- name: Configure mutual-TLS listener
  hosts: remote_libvirt_hosts
  become: true
  gather_facts: true
  roles:
    - libvirt_tls

- name: Define the storage pool and network
  hosts: remote_libvirt_hosts
  become: true
  gather_facts: true
  roles:
    - libvirt_pool_net

- name: Install pinned remote module-restoration appliance images
  hosts: remote_libvirt_hosts
  become: true
  gather_facts: false
  roles:
    - role: remote_libvirt_module_appliance
      when: remote_libvirt_module_appliance_enabled | bool

- name: Apply the gdbstub-port ACL
  hosts: remote_libvirt_hosts
  become: true
  gather_facts: true
  roles:
    - gdbstub_acl

- name: Emit remote-libvirt facts (controller-side)
  hosts: remote_libvirt_hosts
  gather_facts: true
  roles:
    - remote_libvirt_facts
